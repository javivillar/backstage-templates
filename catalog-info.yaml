spec:
  owner: group:default/backstage-admin
  type: keycloak-identity
  parameters:
    - title: User to delete
      required: [username]
      properties:
        username:
          title: Username
          type: string
  steps:
    - id: delete-user
      name: Delete user in Keycloak
      action: keycloak:delete-user
      input:
        username: ${{ parameters.username }}
  output:
    text:
      - title: Resultado
        content: |
          Usuario **${{ parameters.username }}** eliminado de Keycloak.
---
