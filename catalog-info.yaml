          type: boolean
          default: false
        allowCvas:
          title: Allow CREATE VIEW AS
          type: boolean
          default: false
        allowDml:
          title: Allow DML (INSERT/UPDATE/DELETE)
          type: boolean
          default: false
        allowFileUpload:
          title: Allow file upload
          type: boolean
          default: false
        exposeInSqllab:
          title: Expose in SQL Lab
          type: boolean
          default: true
        impersonateUser:
          title: Impersonate logged-in user
          type: boolean
          default: false
        cacheTimeout:
          title: Cache timeout (seconds)
          type: number
    - title: SSH tunnel (optional)
      properties:
        sshTunnelServerAddress:
          title: SSH tunnel server address
          type: string
        sshTunnelServerPort:
          title: SSH tunnel server port
          type: number
        sshTunnelUsername:
          title: SSH tunnel username
          type: string
        sshTunnelPassword:
          title: SSH tunnel password
          type: string
          ui:widget: password
    - title: Advanced
      properties:
        extraJson:
          title: Extra (raw JSON)
