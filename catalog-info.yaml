            (.../site/<id>/dashboard) and cannot be changed later.
          type: string
        title:
          title: Site title
          type: string
        description:
          title: Description
          type: string
        visibility:
          title: Visibility
          type: string
          enum: [PUBLIC, MODERATED, PRIVATE]
          default: PRIVATE
  steps:
    - id: create-site
      name: Create site in Alfresco
      action: alfresco:create-site
      input:
        id: ${{ parameters.id }}
        title: ${{ parameters.title }}
        description: ${{ parameters.description }}
        visibility: ${{ parameters.visibility }}
  output:
    text:
      - title: Resultado
        content: |
          Site **${{ steps['create-site'].output.id }}** creado en Alfresco.
          Eres su SiteManager — gestiona sus members/roles desde la página
          Alfresco Manager en Backstage.
