apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datahub-new-data-product
  title: New data product (declare your data before coding)
  description: >-
    Declare who owns your data, its domain, classification, retention, legal basis
    and where it comes from and goes to. Registers the data product, its datasets,
    processes and PLANNED lineage in DataHub. Domains, glossary terms and tags must
    already exist (stewards manage them). Safe to re-run: nothing is duplicated, and
    assets DataHub already has that Backstage did not create are never touched.
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: Product
      required: [name, slug, description, domain, businessOwner]
      properties:
        name:
          title: Name
          type: string
        slug:
          title: Slug
          description: Lowercase letters/digits and dashes. It becomes urn:li:dataProduct:<slug>.
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description:
          title: Description
          type: string
        domain:
          title: Domain
          description: Id of an EXISTING DataHub domain (e.g. sales, finance, customer).
          type: string
        businessOwner:
          title: Business owner
          description: Keycloak group name (e.g. sales-analytics) or a person's email.
          type: string
        technicalOwner:
          title: Technical owner (optional)
          description: Defaults to you.
          type: string
        steward:
          title: Data steward (optional)
          description: Required from Confidential up; defaults to datahub-admin if left empty.
          type: string
        glossaryTerms:
          title: Glossary terms (optional)
          description: Ids of EXISTING terms (e.g. customer, net-revenue).
          type: array
          items:
            type: string
        tags:
          title: Tags (optional)
          description: Ids of EXISTING tags (e.g. gold, certified).
          type: array
          items:
            type: string
        backstageEntity:
          title: Backstage entity (optional)
          description: e.g. system:default/pedidos-web — recorded on every asset.
          type: string
    - title: Data stores
      required: [stores]
      properties:
        stores:
          title: Data stores
          description: >-
            Databases, topics, S3 prefixes or Alfresco sites this product owns.
            Each becomes a dataset in DataHub with the governance you declare here.
          type: array
          minItems: 1
          items:
            type: object
            required: [kind, classification, retentionDays]
            properties:
              kind:
                title: Kind
                type: string
                enum: [postgres, kafka, s3, alfresco-site]
              database:
                title: Database (postgres only)
                type: string
              schema:
                title: Schema (postgres only)
                type: string
                default: public
              table:
                title: Table (postgres only)
                type: string
              name:
                title: Name (kafka topic / S3 bucket/prefix / Alfresco site shortName)
                type: string
              description:
                title: Description
                type: string
              classification:
                title: Data classification
                type: string
                enum: [Public, Internal, Confidential, Restricted]
              retentionDays:
                title: Retention (days)
                type: integer
                minimum: 1
              lawfulBasis:
                title: Lawful basis (GDPR) — required if any column is personal data
                type: string
                enum: [Consent, Contract, Legal obligation, Legitimate interest, Not personal data]
              freshnessSlaHours:
                title: Freshness SLA (hours, optional)
                type: integer
                minimum: 1
              columns:
                title: Columns (databases)
                type: array
                items:
                  type: object
                  required: [name, type]
                  properties:
                    name:
                      title: Column
                      type: string
                    type:
                      title: Type
                      type: string
                    description:
                      title: Description
                      type: string
                    personal:
                      title: Personal data?
                      type: boolean
                      default: false

    - title: Processes and lineage
      properties:
        processes:
          title: Processes (optional)
          description: >-
            Camunda / Argo / Activepieces processes. What each task reads and writes
            becomes the PLANNED lineage. Refer to a store above as
            `postgres:<db>.<schema>.<table>`, `kafka:<topic>`, `s3:<bucket/prefix>` or
            `alfresco-site:<shortName>`, or paste an existing dataset URN.
          type: array
          items:
            type: object
            required: [engine, id, name]
            properties:
              engine:
                title: Engine
                type: string
                enum: [camunda, argo, activepieces]
              id:
                title: Process id
                type: string
              name:
                title: Name
                type: string
              tasks:
                title: Tasks
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      title: Task id
                      type: string
                    name:
                      title: Name
                      type: string
                    reads:
                      title: Reads
                      type: array
                      items:
                        type: string
                    writes:
                      title: Writes
                      type: array
                      items:
                        type: string

        dryRun:
          title: Validate only
          description: Check the brief against DataHub and show what would be created, without writing anything.
          type: boolean
          default: true
    - title: Backstage catalog (optional)
      properties:
        repoUrl:
          title: Repository for the catalog entities
          description: >-
            Publishes a repo with the product's catalog-info.yaml (a System, a Resource per data store and a Component
            per process, each annotated with its DataHub URN and with a DataHub link) and registers it in the Backstage
            catalog, so the DataHub card and the Data governance tab appear on them. Leave empty to skip. Ignored while
            "Validate only" is on.
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: register
      name: Register in DataHub
      action: datahub:register-data-product
      input:
        dryRun: ${{ parameters.dryRun }}
        brief:
          slug: ${{ parameters.slug }}
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          domain: ${{ parameters.domain }}
          businessOwner: ${{ parameters.businessOwner }}
          technicalOwner: ${{ parameters.technicalOwner }}
          steward: ${{ parameters.steward }}
          terms: ${{ parameters.glossaryTerms }}
          tags: ${{ parameters.tags }}
          backstageEntity: ${{ parameters.backstageEntity }}
          stores: ${{ parameters.stores }}
          processes: ${{ parameters.processes }}
    - id: catalog-info
      name: Generate the Backstage catalog entities
      action: datahub:write-catalog-info
      input:
        brief:
          slug: ${{ parameters.slug }}
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          domain: ${{ parameters.domain }}
          businessOwner: ${{ parameters.businessOwner }}
          technicalOwner: ${{ parameters.technicalOwner }}
          steward: ${{ parameters.steward }}
          terms: ${{ parameters.glossaryTerms }}
          tags: ${{ parameters.tags }}
          backstageEntity: ${{ parameters.backstageEntity }}
          stores: ${{ parameters.stores }}
          processes: ${{ parameters.processes }}
    - id: publish
      name: Publish the repository
      if: ${{ not parameters.dryRun and parameters.repoUrl }}
      action: publish:github
      input:
        description: ${{ parameters.name }} - data product registered in DataHub
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        gitCommitMessage: 'Register data product ${{ parameters.slug }} (catalog-info.yaml)'
    - id: catalog
      name: Register in the Backstage catalog
      if: ${{ not parameters.dryRun and parameters.repoUrl }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Open the data product in DataHub
        url: ${{ steps['register'].output.productUrl }}
    text:
      - title: Result
        content: |
          ${{ 'Validated only — nothing was written.' if steps['register'].output.dryRun else 'Registered in DataHub.' }}

          Created: ${{ steps['register'].output.created | join(', ') }}

          Updated: ${{ steps['register'].output.updated | join(', ') }}

          ${{ steps['register'].output.warnings | join(' · ') }}

          ${{ ('Catalog: repository ' ~ steps['publish'].output.remoteUrl ~ ' published and registered.') if (steps['publish'] and steps['publish'].output.remoteUrl) else 'Catalog: nothing published (no repository chosen, or validate-only).' }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datahub-register-asset
  title: Register data assets in an existing data product
  description: >-
    Adds databases, topics, S3 prefixes, Alfresco sites and processes to a data product
    Backstage already manages. Only the product's asset list is merged: nothing else of
    the product is rewritten. You must own the product (or be a steward / backstage-admin).
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: Product
      required: [productSlug]
      properties:
        productSlug:
          title: Data product slug
          description: The slug of an existing product created from Backstage.
          type: string
    - title: Data stores
      required: [stores]
      properties:
        stores:
          title: Data stores
          description: >-
            Databases, topics, S3 prefixes or Alfresco sites this product owns.
            Each becomes a dataset in DataHub with the governance you declare here.
          type: array
          minItems: 1
          items:
            type: object
            required: [kind, classification, retentionDays]
            properties:
              kind:
                title: Kind
                type: string
                enum: [postgres, kafka, s3, alfresco-site]
              database:
                title: Database (postgres only)
                type: string
              schema:
                title: Schema (postgres only)
                type: string
                default: public
              table:
                title: Table (postgres only)
                type: string
              name:
                title: Name (kafka topic / S3 bucket/prefix / Alfresco site shortName)
                type: string
              description:
                title: Description
                type: string
              classification:
                title: Data classification
                type: string
                enum: [Public, Internal, Confidential, Restricted]
              retentionDays:
                title: Retention (days)
                type: integer
                minimum: 1
              lawfulBasis:
                title: Lawful basis (GDPR) — required if any column is personal data
                type: string
                enum: [Consent, Contract, Legal obligation, Legitimate interest, Not personal data]
              freshnessSlaHours:
                title: Freshness SLA (hours, optional)
                type: integer
                minimum: 1
              columns:
                title: Columns (databases)
                type: array
                items:
                  type: object
                  required: [name, type]
                  properties:
                    name:
                      title: Column
                      type: string
                    type:
                      title: Type
                      type: string
                    description:
                      title: Description
                      type: string
                    personal:
                      title: Personal data?
                      type: boolean
                      default: false

    - title: Processes and lineage
      properties:
        processes:
          title: Processes (optional)
          description: >-
            Camunda / Argo / Activepieces processes. What each task reads and writes
            becomes the PLANNED lineage. Refer to a store above as
            `postgres:<db>.<schema>.<table>`, `kafka:<topic>`, `s3:<bucket/prefix>` or
            `alfresco-site:<shortName>`, or paste an existing dataset URN.
          type: array
          items:
            type: object
            required: [engine, id, name]
            properties:
              engine:
                title: Engine
                type: string
                enum: [camunda, argo, activepieces]
              id:
                title: Process id
                type: string
              name:
                title: Name
                type: string
              tasks:
                title: Tasks
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      title: Task id
                      type: string
                    name:
                      title: Name
                      type: string
                    reads:
                      title: Reads
                      type: array
                      items:
                        type: string
                    writes:
                      title: Writes
                      type: array
                      items:
                        type: string

        dryRun:
          title: Validate only
          type: boolean
          default: true
  steps:
    - id: register
      name: Register in DataHub
      action: datahub:register-asset
      input:
        productSlug: ${{ parameters.productSlug }}
        dryRun: ${{ parameters.dryRun }}
        stores: ${{ parameters.stores }}
        processes: ${{ parameters.processes }}
  output:
    links:
      - title: Open the data product in DataHub
        url: ${{ steps['register'].output.productUrl }}
    text:
      - title: Result
        content: |
          ${{ 'Validated only — nothing was written.' if steps['register'].output.dryRun else 'Registered in DataHub.' }}

          Created: ${{ steps['register'].output.created | join(', ') }}

          ${{ steps['register'].output.warnings | join(' · ') }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datahub-deprecate-asset
  title: Deprecate a data asset
  description: >-
    Marks a dataset, data flow or data product that Backstage created as deprecated (or
    reverses it). Assets that were ingested, or created by someone else, are never touched
    here: ask a steward. You must own the asset's product (or be a steward / backstage-admin).
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: Asset
      required: [urn, note]
      properties:
        urn:
          title: Asset URN
          description: e.g. urn:li:dataset:(urn:li:dataPlatform:postgres,pedidos_web.public.pedidos,PROD)
          type: string
        note:
          title: Reason / replacement
          type: string
        deprecated:
          title: Deprecated
          description: Untick to remove the deprecation.
          type: boolean
          default: true
  steps:
    - id: deprecate
      name: Deprecate in DataHub
      action: datahub:deprecate
      input:
        urn: ${{ parameters.urn }}
        note: ${{ parameters.note }}
        deprecated: ${{ parameters.deprecated }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datahub-check-impact
  title: Check the impact of changing a dataset
  description: >-
    Before you change a table or a schema: lists the assets downstream of it (DataHub lineage: datasets, jobs,
    charts, dashboards), how many are marked dq-critical, and the owners you should warn first. Read-only.
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: Dataset
      required: [urn]
      properties:
        urn:
          title: Dataset URN
          description: e.g. urn:li:dataset:(urn:li:dataPlatform:postgres,crm.public.customers,PROD)
          type: string
  steps:
    - id: impact
      name: Compute the downstream impact
      action: datahub:check-impact
      input:
        urn: ${{ parameters.urn }}
  output:
    text:
      - title: Impact
        content: |
          ${{ steps['impact'].output.headline }}

          dq-critical assets affected: ${{ steps['impact'].output.critical }}

          Tell first: ${{ steps['impact'].output.owners | join(', ') }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: datahub-request-vocabulary
  title: Request DataHub vocabulary
  description: >-
    Need a domain, glossary term, tag or allowed value that does not exist yet? You cannot create it yourself (stewards
    curate the vocabulary). This opens a request for them. It refuses what already exists and does not duplicate an open request.
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: What do you need?
      required: [kind, name, description, justification]
      properties:
        kind:
          title: Kind
          type: string
          enum: [domain, glossaryTerm, tag, structuredPropertyValue]
          enumNames: [Domain, Glossary term, Tag, Allowed value of a structured property]
        name:
          title: Name
          type: string
        property:
          title: Structured property (only for "allowed value")
          description: e.g. refresquito.lawful_basis or refresquito.data_classification
          type: string
        description:
          title: Definition
          description: What it means, so a steward can define it precisely.
          type: string
          ui:widget: textarea
        justification:
          title: Why the existing vocabulary is not enough
          type: string
          ui:widget: textarea
        relatedProduct:
          title: Related data product (optional)
          type: string
        dryRun:
          title: Preview only
          description: Show the request that would be filed, without filing it.
          type: boolean
          default: true
  steps:
    - id: request
      name: File the request
      action: datahub:request-vocabulary
      input:
        kind: ${{ parameters.kind }}
        name: ${{ parameters.name }}
        property: ${{ parameters.property }}
        description: ${{ parameters.description }}
        justification: ${{ parameters.justification }}
        relatedProduct: ${{ parameters.relatedProduct }}
        dryRun: ${{ parameters.dryRun }}
  output:
    links:
      - title: Open the request
        url: ${{ steps['request'].output.issueUrl }}
    text:
      - title: Result
        content: |
          ${{ 'Preview only — nothing was filed.' if steps['request'].output.dryRun else ('This was already requested (open issue reused).' if steps['request'].output.alreadyRequested else 'Request filed for the data stewards.') }}

          ${{ steps['request'].output.title }}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: refresquito-services-docs
  title: Servicios Refresquito — documentación
  description: >-
    Qué ofrece cada servicio de Refresquito desde Backstage, quién puede hacer qué
    y qué esperar de él. Pensada para quien desarrolla en la plataforma.
  tags: [documentation, refresquito]
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: documentation
  lifecycle: production
  owner: group:default/backstage-admin
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-framework-app
  title: New application (Python Framework)
  description: >-
    Creates a new business application built with the Python Framework of the platform (an Angular
    web, a FastAPI service and PostgreSQL, behind Keycloak) and proposes its deployment: the
    repository, a working copy of the petstore with the names you give here, its tests and its CI;
    its entry in the catalog; and a pull request to refresquito-services that, once merged, deploys
    it in the environments you choose with the platform blocks it uses.
  tags: [python-framework, fastapi, angular, postgresql]
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
    - title: The application
      required: [name, title, description]
      properties:
        name:
          title: Name
          description: >-
            Lowercase letters and digits, starting with a letter (no dashes). It names the
            repository, the Python package, the Keycloak client, the roles <name>-viewer and
            <name>-admin, the host <name>.<domain> and the namespace <zone>-<program>-<name>-oneke.
          type: string
          pattern: '^[a-z][a-z0-9]{2,30}$'
          ui:autofocus: true
        title:
          title: Title
          description: How people read it, e.g. Orders.
          type: string
          maxLength: 60
          pattern: '^[^"]+$'
        description:
          title: Description
          description: One sentence on what the application is for.
          type: string
          maxLength: 200
    - title: Its first entity
      description: >-
        The application starts with one entity (name, category, status and start date), with its
        list, its form and its API. Change it afterwards into what the application is about.
      required: [entity, entities]
      properties:
        entity:
          title: Entity, singular
          description: Lowercase letters only, e.g. order. It names the table and the class (Order).
          type: string
          pattern: '^[a-z]{2,30}$'
        entities:
          title: Entity, plural
          description: Lowercase letters only, e.g. orders. It names the API path (/api/orders) and the page.
          type: string
          pattern: '^[a-z]{2,30}$'
    - title: Where it runs
      description: >-
        The application is deployed by Argo CD from refresquito-services. This template does not
        touch any cluster: it opens a pull request there, and merging it is what deploys.
      required: [environments, initialStage, frameworkVersion]
      properties:
        environments:
          title: Environments
          description: >-
            The clusters to deploy it in, as <zone>-<program>. More can be added later, in the file
            of the application (bootstrap/app-of-apps/apps/<name>.yaml of refresquito-services).
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            # one entry per cluster of the platform
            enum: [nato-sirtap]
          default: [nato-sirtap]
          ui:widget: checkboxes
        initialStage:
          title: Initial stage
          description: >-
            The stage it starts in. dev (the default): namespace <zone>-<program>-<name>-dev-oneke,
            https://<name>-dev.<domain>, its own Keycloak client <name>-dev and the test users <name>-dev-viewer and
            <name>-dev-admin. It moves on to pre and pro with the template "Promote an application (Python Framework)".
            The data catalog (DataHub) is only for pro.
          type: string
          enum: [dev, pre, pro]
          default: dev
        frameworkVersion:
          title: Version of the Python Framework
          description: >-
            The maintained lines (its support policy: the latest major version, and the previous one for
            6 months). 2.0 adds the audit trail, apart from the logs of the application, with its metrics
            for Prometheus. 0.1 is maintained until 2027-04-15.
          type: string
          enum: ['2.0', '0.1']
          enumNames: ['2.0 (refresquito-fastapi 2.0.0, refresquito-angular 2.0.0) - audit trail', '0.1 (refresquito-fastapi 0.1.0, refresquito-angular 0.1.0)']
          default: '2.0'
    - title: Platform blocks
      description: >-
        What the application uses of the platform. Each block is created when the application is
        deployed, appears in the catalog as a resource of the application, and makes it depend on
        the service that provides it. Removing a block later never deletes what it created.
      properties:
        sso:
          title: Single sign-on (Keycloak)
          description: >-
            A public client named as the application, the realm roles <name>-viewer and
            <name>-admin, and one test user per role. Every application of the framework has it:
            the web signs in with it and the API reads the roles from the token.
          type: boolean
          default: true
          ui:readonly: true
        s3Buckets:
          title: Object storage (SeaweedFS, S3) - buckets
          description: >-
            Optional. One short name per bucket, e.g. documents: the application gets the bucket
            <name>-documents, an identity of its own allowed on its buckets only, and its access key
            in the environment of the API (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
            AWS_ENDPOINT_URL_S3, S3_BUCKETS). Empty, the application does not use object storage.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'
          default: []
        dmsSites:
          title: Documents (Alfresco) - sites
          description: >-
            Optional. One short name per site, e.g. documents: the application gets the private Alfresco
            site <name>-documents, a person of its own that works in it, and its credentials in the
            environment of the API (ALFRESCO_URL, ALFRESCO_USERNAME, ALFRESCO_PASSWORD, ALFRESCO_SITES).
            Empty, the application does not use Alfresco.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'
          default: []
        dmsGroups:
          title: Documents (Alfresco) - groups of people who may enter its sites
          description: >-
            Keycloak groups (name or /path) whose members enter every site of the application, as
            Consumer the first time. Only used with sites. Empty, people are added later to the group
            alfrescodms-site-<name>-<site>.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        datahub:
          title: Data catalog (DataHub) - register its data
          description: >-
            Optional. A data product <name> in DataHub with one dataset per table of its database, read
            from its schema every few minutes (migrations show up by themselves). Its team is the
            technical owner. The application gets nothing in its environment.
          type: boolean
          default: false
        dataOwners:
          title: Data catalog (DataHub) - people who own its data
          description: User names of the realm, business owners of its data product. Only used with the data catalog.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]*$'
          default: []
        dataOwnerGroups:
          title: Data catalog (DataHub) - groups that own its data
          description: Keycloak groups (name or /path), business owners of its data product. Only used with the data catalog.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        gateway:
          title: API gateway (Gravitee) - publish its API
          description: >-
            Optional. Its API in Gravitee at /gateway/<name>/, public in the developer portal with its
            OpenAPI. Calls need a token of the realm from a subscribed Keycloak client; the web of the
            application is subscribed. The application gets nothing in its environment.
          type: boolean
          default: false
        gatewayTeam:
          title: API gateway (Gravitee) - team that sees it in Backstage
          description: Optional. A Keycloak group gravitee-team-<name>. Only used with the gateway.
          type: string
          pattern: '^(gravitee-team-[a-z0-9-]+)?$'
          default: ""
        processes:
          title: Processes (Camunda) - deploy its processes
          description: >-
            Optional. The BPMN in platform/processes/ of its repository (it starts with an example,
            <name>-review) are deployed in Camunda with each version. The API gets its own identity
            there (CAMUNDA_URL, CAMUNDA_USERNAME, CAMUNDA_PASSWORD) to start them and work their tasks.
          type: boolean
          default: false
        processGroups:
          title: Processes (Camunda) - groups that start them and work their tasks
          description: Keycloak groups (name or /path) whose members use them in Tasklist. Only used with processes.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        dashboards:
          title: Dashboards (Superset) - import its dashboards
          description: >-
            Optional. The Superset export in platform/dashboards/ of its repository (it starts with an
            example over its main table) is imported in Superset with each version, over its own database,
            read with a read-only role. The superset-editor and superset-admin groups see them.
          type: boolean
          default: false
        flows:
          title: Flows (Activepieces) - import its flows
          description: >-
            Optional. The flows in platform/flows/ of its repository (one exported flow per file; it starts
            with an example, new-<entity>, a webhook) are imported in an Activepieces project of its own with
            each version, and published once complete. The API gets the webhook of each one
            (ACTIVEPIECES_FLOW_<FLOW>_URL).
          type: boolean
          default: false
        flowGroups:
          title: Flows (Activepieces) - groups that edit them
          description: Keycloak groups (name or /path) whose members are editors of its project. Only used with flows.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        monitoring:
          title: Monitoring (Prometheus, Grafana) - its metrics and dashboards
          description: >-
            Prometheus scrapes the metrics of its API, and Grafana gets in the folder apps the dashboards
            <title> - Logs (levels, errors, failed requests, the lines) and <title> - Performance (traffic,
            errors, latency per route, CPU and memory) of each stage, plus the ones in platform/monitoring/
            of its repository. Off: nothing of it is scraped and it gets no dashboards.
          type: boolean
          default: true
        admins:
          title: People who get the role <name>-admin
          description: User names of the realm (they must exist; nobody is created). Empty, only the test user has it.
          type: array
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,60}$'
          default: []
    - title: Repository
      properties:
        owner:
          title: GitHub owner
          description: User or organization that will own the repository <owner>/<name>. It is created private.
          type: string
          default: javivillar
  steps:
    - id: fetch
      name: Generate the application from the skeleton
      action: fetch:template
      input:
        # one skeleton per line of the framework (tools/make-python-app-skeleton.py writes them)
        url: ./skeletons/python-framework-app-${{ parameters.frameworkVersion }}
        targetPath: ./app
        # binaries, the lock file, and files with a ${...} syntax of their own
        copyWithoutTemplating:
          - vendor/**
          - frontend/package-lock.json
          - frontend/public/favicon.ico
          - .github/workflows/**
          - backend/migrations/script.py.mako
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          entity: ${{ parameters.entity }}
          entityTitle: ${{ parameters.entity | capitalize }}
          entities: ${{ parameters.entities }}
          entitiesTitle: ${{ parameters.entities | capitalize }}
          owner: ${{ parameters.owner }}
    - id: publish
      name: Create the repository
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.owner }}&repo=${{ parameters.name }}
        sourcePath: ./app
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        gitCommitMessage: '${{ parameters.name }} 0.1.0: created from the template "New application (Python Framework)"'
    - id: register
      name: Register in the Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        # The location is added first; then the action reads the file back from GitHub only to name the entity of
        # the link "Open in the catalog". A dropped connection there (ECONNRESET) stopped the whole template before
        # the deployment pull request. Optional: the template goes on, and the catalog reads the location by itself.
        optional: true
        catalogInfoPath: '/catalog-info.yaml'
    # The deployment is GitOps: two files in refresquito-services (the file of the application and
    # the definition of its API), proposed as a pull request. Merging it is what deploys.
    - id: deployment
      name: Prepare the deployment (the file of the application)
      action: fetch:template
      input:
        url: ./skeletons/python-framework-deploy
        targetPath: ./deploy
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          entity: ${{ parameters.entity }}
          entityTitle: ${{ parameters.entity | capitalize }}
          entities: ${{ parameters.entities }}
          entitiesTitle: ${{ parameters.entities | capitalize }}
          owner: ${{ parameters.owner }}
          environments: ${{ parameters.environments }}
          admins: ${{ parameters.admins }}
          buckets: ${{ parameters.s3Buckets }}
          sites: ${{ parameters.dmsSites }}
          siteGroups: ${{ parameters.dmsGroups }}
          datahub: ${{ parameters.datahub }}
          dataOwners: ${{ parameters.dataOwners }}
          dataOwnerGroups: ${{ parameters.dataOwnerGroups }}
          gateway: ${{ parameters.gateway }}
          gatewayTeam: ${{ parameters.gatewayTeam }}
          processes: ${{ parameters.processes }}
          processGroups: ${{ parameters.processGroups }}
          dashboards: ${{ parameters.dashboards }}
          flows: ${{ parameters.flows }}
          flowGroups: ${{ parameters.flowGroups }}
          monitoring: ${{ parameters.monitoring }}
          # the commit just pushed: its CI builds the two images with that tag
          tag: ${{ steps['publish'].output.commitHash }}
          stage: ${{ parameters.initialStage }}
          fastapi: ${{ parameters.frameworkVersion }}.0
          angular: ${{ parameters.frameworkVersion }}.0
    - id: deploy
      name: Open the deployment pull request in refresquito-services
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: deploy-${{ parameters.name }}
        targetBranchName: main
        sourcePath: ./deploy
        title: 'Deploy ${{ parameters.name }} (${{ parameters.title }}) in ${{ parameters.environments | join(", ") }}, stage ${{ parameters.initialStage }}'
        commitMessage: '${{ parameters.name }}: a new application of the Python Framework, deployed in ${{ parameters.environments | join(", ") }} (stage ${{ parameters.initialStage }})'
        description: |
          **${{ parameters.title }}**: ${{ parameters.description }}

          Created with the Backstage template "New application (Python Framework)": repository
          [${{ parameters.owner }}/${{ parameters.name }}](https://github.com/${{ parameters.owner }}/${{ parameters.name }}), commit `${{ steps['publish'].output.commitHash }}`.

          Merging this deploys it, with no pass of the bootstrap:

          | | |
          |---|---|
          | Environments | ${{ parameters.environments | join(", ") }} |
          | Stage | ${{ parameters.initialStage }} (it moves on with the template "Promote an application") |
          | Namespace | `<zone>-<program>-${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-oneke` |
          | URL | `https://${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}.<domain>` |
          | Images | `ghcr.io/${{ parameters.owner }}/${{ parameters.name }}-api` and `-web`, tag of that commit (its CI must have finished) |
          | Platform blocks | `sso`: client `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}`, roles `${{ parameters.name }}-viewer` and `${{ parameters.name }}-admin`, their test users{% if parameters.s3Buckets | length %}. `s3`: buckets ${{ parameters.s3Buckets | join(", ") }} (each one as `${{ parameters.name }}-<bucket>`){% endif %}{% if parameters.dmsSites | length %}. `dms`: Alfresco sites ${{ parameters.dmsSites | join(", ") }} (each one as `${{ parameters.name }}-<site>`){% endif %}{% if parameters.datahub %}. `datahub`: data product `${{ parameters.name }}` with the tables of its database{% endif %}{% if parameters.gateway %}. `gateway`: its API at `/gateway/${{ parameters.name }}/` in Gravitee{% endif %}{% if parameters.processes %}. `processes`: its BPMN of `platform/processes/` in Camunda{% endif %}{% if parameters.dashboards %}. `dashboards`: its Superset export of `platform/dashboards/`{% endif %}{% if parameters.flows %}. `flows`: its Activepieces flows of `platform/flows/`{% endif %}{% if parameters.monitoring %}. `monitoring`: its metrics in Prometheus, dashboards Logs and Performance in the Grafana folder `apps`{% endif %} |
          | Python Framework | ${{ parameters.frameworkVersion }} |

          Files: `bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml` (what it is and what it uses) and
          `catalog/apis/${{ parameters.name }}.json` (its API, for the catalog). See `charts/python-app-oneke/INSTALL.md`.
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Deployment pull request
        url: ${{ steps['deploy'].output.remoteUrl }}
      - title: Open in the catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef or ('component:default/' + parameters.name) }}
    text:
      - title: Next - merge the deployment pull request
        content: |
          The repository exists and its CI is building the two images of commit `${{ steps['publish'].output.commitHash }}`.

          Its deployment is proposed in a **pull request of refresquito-services** (the link above). Once the CI of the
          application has finished, merging that pull request deploys it: Argo CD creates
          `<zone>-<program>-${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-oneke` in ${{ parameters.environments | join(", ") }} (stage **${{ parameters.initialStage }}**), and
          within a few minutes the application answers on `https://${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}.<domain>` with its Keycloak client
          `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}`, its roles and the test users `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-admin` and `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-viewer`.

          Nothing else is needed: no command to run and no pass of the bootstrap. To roll out a later commit, or to move it on
          to pre and pro, use the template **Promote an application (Python Framework)**.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-framework-promote
  title: Promote an application (Python Framework)
  description: >-
    Moves a version of an application of the Python Framework to a stage (dev, pre or pro): the tag of one stage,
    or a commit of its repository, becomes the tag of the stage you choose. It opens a pull request to
    refresquito-services that changes only that line of the file of the application; merging it deploys that
    version in that stage (each stage is a namespace of its own in the same cluster).
  tags:
    - python-framework
    - promotion
    - gitops
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
    - title: What to promote
      required:
        - name
        - source
        - target
      properties:
        name:
          title: Application
          description: Its name, as in bootstrap/app-of-apps/apps/<name>.yaml of refresquito-services (e.g. orders).
          type: string
          pattern: ^[a-z][a-z0-9]{2,30}$
          ui:autofocus: true
        source:
          title: From
          description: The stage whose version moves on, or a commit of the application (to start a new version, usually in dev).
          type: string
          enum: [dev, pre, commit]
          enumNames: ["the version of dev", "the version of pre", "a commit of its repository"]
          default: dev
        target:
          title: To
          description: The stage that takes that version. dev and pre are namespaces <zone>-<program>-<name>-<stage>-oneke on https://<name>-<stage>.<domain>; pro is the application itself.
          type: string
          enum: [dev, pre, pro]
          default: pro
      dependencies:
        source:
          oneOf:
            - properties:
                source: { enum: [commit] }
                commit:
                  title: Commit
                  description: The commit of the application whose images to deploy (its CI must have published them).
                  type: string
                  pattern: ^[0-9a-f]{7,40}$
              required: [commit]
            - properties:
                source: { enum: [dev, pre] }
  steps:
    - id: fetch
      name: Read the file of the application
      action: fetch:plain:file
      input:
        url: https://github.com/javivillar/refresquito-services/blob/main/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
        targetPath: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml

    - id: parse
      name: Find the tag of each stage
      action: roadiehq:utils:fs:parse
      input:
        path: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
        parser: yaml

    # Only the line of the stage changes: the file keeps its comments and its order.
    - id: first-stage
      name: Move it to stages (it had only pro, in image.tag)
      if: ${{ not steps['parse'].output.content.stages and parameters.target != "pro" }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nimage:\n  registry: [^\n]*\n)  tag: "([^"]*)"[^\n]*\n'
            replaceWith: "$1# its stages (dev, pre, pro), each a deployment of its own; the template Promote moves a tag on\nstages:\n  pro: { tag: \"$2\" }\n"

    - id: set-image
      name: Set the tag of pro (it has only pro, in image.tag)
      if: ${{ not steps['parse'].output.content.stages and parameters.target == "pro" }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nimage:\n  registry: [^\n]*\n  tag: )"[^"]*"'
            replaceWith: "$1\"${{ parameters.commit if parameters.source == 'commit' else '' }}\""

    - id: set
      name: Set the tag of ${{ parameters.target }}
      if: ${{ steps['parse'].output.content.stages and steps['parse'].output.content.stages[parameters.target] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\n  ${{ parameters.target }}: \{ tag: )"[^"]*"'
            replaceWith: "$1\"${{ parameters.commit if parameters.source == 'commit' else steps['parse'].output.content.stages[parameters.source].tag }}\""

    - id: add
      name: Add the stage ${{ parameters.target }}
      if: ${{ (steps['parse'].output.content.stages and not steps['parse'].output.content.stages[parameters.target]) or (not steps['parse'].output.content.stages and parameters.target != "pro") }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nstages:\n)'
            replaceWith: "$1  ${{ parameters.target }}: { tag: \"${{ parameters.commit if parameters.source == 'commit' else (steps['parse'].output.content.stages[parameters.source].tag if steps['parse'].output.content.stages else '') }}\" }\n"

    - id: promote
      name: Open the pull request in refresquito-services
      # nothing to promote when the stage it moves from has no version
      if: ${{ parameters.source == 'commit' or (steps['parse'].output.content.stages and steps['parse'].output.content.stages[parameters.source]) }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: promote-${{ parameters.name }}-${{ parameters.target }}
        targetBranchName: main
        sourcePath: ./promote
        update: true
        title: >-
          Promote ${{ parameters.name }} to ${{ parameters.target }}
          (${{ ("commit " + parameters.commit | truncate(12, true, "")) if parameters.source == "commit" else ("the version of " + parameters.source) }})
        commitMessage: >-
          ${{ parameters.name }}: ${{ parameters.target }} takes
          ${{ ("commit " + parameters.commit) if parameters.source == "commit" else ("the version of " + parameters.source) }}
        description: |
          **${{ parameters.name }}**: the stage **${{ parameters.target }}** takes
          ${{ ("the commit `" + parameters.commit + "`") if parameters.source == "commit" else ("the version of **" + parameters.source + "**, commit `" + (steps["parse"].output.content.stages[parameters.source].tag if steps["parse"].output.content.stages else "?") + "`") }}.

          Created with the Backstage template "Promote an application (Python Framework)". It changes only
          `stages.${{ parameters.target }}.tag` in `bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml`
          (see *Stages* in `charts/python-app-oneke/INSTALL.md`). Merging it deploys that version: Argo CD rolls out
          `${{ parameters.name if parameters.target == "pro" else (parameters.name + "-" + parameters.target) }}-oneke`
          on `https://${{ parameters.name if parameters.target == "pro" else (parameters.name + "-" + parameters.target) }}.<domain>`.
          The CI of this pull request renders the stack: it fails when the stage it moves from has no version.

  output:
    links:
      - title: Promotion pull request
        url: ${{ steps['promote'].output.remoteUrl }}
    text:
      - title: ${{ 'Next - review and merge the pull request' if steps['promote'].output.remoteUrl else 'Nothing was promoted' }}
        content: |
          ${{ ('Merging the pull request deploys the version in **' + parameters.target + '**; Argo CD does it within a few minutes, with no pass of the bootstrap. The tags of the other stages do not change.') if steps['promote'].output.remoteUrl else ('**' + parameters.name + '** has no version in **' + parameters.source + '**: no pull request was opened. Put a commit there first (From: a commit of its repository).') }}
