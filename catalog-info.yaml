  tags: [superset, data]
spec:
  owner: group:default/backstage-admin
  type: superset-resource
  parameters:
    - title: Connection to update
      required: [currentDatabaseName, databaseName, sqlalchemyUri]
      properties:
        currentDatabaseName:
          title: Existing connection name
          description: Identifies the connection to update.
          type: string
        databaseName:
          title: Connection name
          type: string
        sqlalchemyUri:
          title: SQLAlchemy URI
          type: string
    - title: Options
      properties:
        allowCtas:
          title: Allow CREATE TABLE AS
          type: boolean
          default: false
        allowCvas:
          title: Allow CREATE VIEW AS
          type: boolean
          default: false
        allowDml:
          title: Allow DML (INSERT/UPDATE/DELETE)
          type: boolean
          default: false
        allowFileUpload:
          title: Allow file upload
          type: boolean
          default: false
        exposeInSqllab:
          title: Expose in SQL Lab
          type: boolean
          default: true
        impersonateUser:
          title: Impersonate logged-in user
          type: boolean
          default: false
        cacheTimeout:
          title: Cache timeout (seconds)
          type: number
    - title: SSH tunnel (optional)
      properties:
        sshTunnelServerAddress:
          title: SSH tunnel server address
          type: string
        sshTunnelServerPort:
          title: SSH tunnel server port
          type: number
        sshTunnelUsername:
          title: SSH tunnel username
          type: string
        sshTunnelPassword:
          title: SSH tunnel password
          type: string
          ui:widget: password
    - title: Advanced
      properties:
        extraJson:
          title: Extra (raw JSON)
          type: string
          ui:widget: textarea
  steps:
    - id: update-connection
      name: Update connection in Superset
      action: superset:update-connection
      input:
        currentDatabaseName: ${{ parameters.currentDatabaseName }}
        databaseName: ${{ parameters.databaseName }}
        sqlalchemyUri: ${{ parameters.sqlalchemyUri }}
        allowCtas: ${{ parameters.allowCtas }}
        allowCvas: ${{ parameters.allowCvas }}
        allowDml: ${{ parameters.allowDml }}
        allowFileUpload: ${{ parameters.allowFileUpload }}
        exposeInSqllab: ${{ parameters.exposeInSqllab }}
        impersonateUser: ${{ parameters.impersonateUser }}
        cacheTimeout: ${{ parameters.cacheTimeout }}
        sshTunnelServerAddress: ${{ parameters.sshTunnelServerAddress }}
        sshTunnelServerPort: ${{ parameters.sshTunnelServerPort }}
        sshTunnelUsername: ${{ parameters.sshTunnelUsername }}
        sshTunnelPassword: ${{ parameters.sshTunnelPassword }}
        extraJson: ${{ parameters.extraJson }}
  output:
    text:
      - title: Resultado
        content: |
          Conexión **${{ parameters.currentDatabaseName }}** actualizada en Superset.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: superset-create-dataset
  title: Create Superset Dataset
  description: >-
    Create a dataset in Superset on top of a connection you own. Open to any
    signed-in user — you become the owner and only you (or backstage-admin)
    can edit/delete it later.
  tags: [superset, data]
spec:
  owner: group:default/backstage-admin
  type: superset-resource
  parameters:
    - title: Dataset details
      required: [connectionName, tableName]
      properties:
        connectionName:
          title: Connection
          description: >-
            Name of a database connection you own (or, if you're
            backstage-admin, any connection).
          type: string
        schema:
          title: Schema
          type: string
        tableName:
          title: Table name
          description: >-
            Physical table name, or a display name if you fill in the SQL
            field below.
          type: string
        sql:
          title: SQL (virtual dataset)
          description: >-
            Leave empty for a physical (table-backed) dataset; fill in for a
            virtual (query-backed) one.
          type: string
          ui:widget: textarea
  steps:
    - id: create-dataset
      name: Create dataset in Superset
      action: superset:create-dataset
      input:
        connectionName: ${{ parameters.connectionName }}
        schema: ${{ parameters.schema }}
        tableName: ${{ parameters.tableName }}
        sql: ${{ parameters.sql }}
  output:
    text:
      - title: Resultado
        content: |
          Dataset **${{ steps['create-dataset'].output.tableName }}** creado
          en Superset (id `${{ steps['create-dataset'].output.id }}`).
---
