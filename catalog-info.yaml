  owner: group:default/backstage-admin
  type: superset-resource
  parameters:
    - title: Chart
      required: [sliceName, vizType, datasetName]
      properties:
        sliceName:
          title: Chart name
          type: string
        vizType:
          title: Visualization type
          type: string
          enum:
            - table
            - big_number_total
            - big_number
            - line
            - bar
            - pie
            - area
            - dist_bar
            - echarts_timeseries_line
            - echarts_timeseries_bar
        datasetName:
          title: Dataset
          description: >-
            Name of a dataset you own (or, if you're backstage-admin, any
            dataset).
          type: string
  steps:
    - id: provision-chart
      name: Provision chart in Superset
      action: superset:provision-chart
      input:
        sliceName: ${{ parameters.sliceName }}
        vizType: ${{ parameters.vizType }}
        datasetName: ${{ parameters.datasetName }}
  output:
    text:
      - title: Resultado
        content: |
          Chart **${{ parameters.sliceName }}** creado en Superset. Termina
          de construirlo aquí: ${{ steps['provision-chart'].output.exploreUrl }}
