  description: >-
    Marks a dataset, data flow or data product that Backstage created as deprecated (or
    reverses it). Assets that were ingested, or created by someone else, are never touched
    here: ask a steward. You must own the asset's product (or be a steward / backstage-admin).
  tags: [datahub, governance, data]
