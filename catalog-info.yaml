apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: superset-create-connection
  title: Create Superset Connection
  description: >-
    Create a database connection in Superset. Open to any signed-in user —
    you become the owner and only you (or backstage-admin) can edit/delete
    it later, and only you can build datasets on top of it.
  tags: [superset, data]
spec:
  owner: group:default/backstage-admin
  type: superset-resource
  parameters:
    - title: Connection
      required: [databaseName, sqlalchemyUri]
      properties:
        databaseName:
          title: Connection name
          type: string
        sqlalchemyUri:
          title: SQLAlchemy URI
          description: 'e.g. postgresql://user:pass@host:5432/dbname'
          type: string
    - title: Options
      properties:
        allowCtas:
          title: Allow CREATE TABLE AS
          type: boolean
          default: false
        allowCvas:
          title: Allow CREATE VIEW AS
          type: boolean
          default: false
        allowDml:
          title: Allow DML (INSERT/UPDATE/DELETE)
          type: boolean
          default: false
        allowFileUpload:
          title: Allow file upload
          type: boolean
          default: false
        exposeInSqllab:
          title: Expose in SQL Lab
          type: boolean
          default: true
        impersonateUser:
          title: Impersonate logged-in user
          type: boolean
          default: false
        cacheTimeout:
          title: Cache timeout (seconds)
          type: number
    - title: SSH tunnel (optional)
      properties:
        sshTunnelServerAddress:
          title: SSH tunnel server address
          type: string
        sshTunnelServerPort:
          title: SSH tunnel server port
          type: number
        sshTunnelUsername:
          title: SSH tunnel username
          type: string
        sshTunnelPassword:
          title: SSH tunnel password
          type: string
          ui:widget: password
    - title: Advanced
      properties:
        extraJson:
          title: Extra (raw JSON)
          description: >-
            Passed through verbatim as Superset's "Extra" field —
            engine_params, metadata_params, schemas_allowed_for_file_upload,
            cost-estimate flags, etc. Leave empty for {}.
          type: string
          ui:widget: textarea
  steps:
    - id: create-connection
      name: Create connection in Superset
      action: superset:create-connection
      input:
        databaseName: ${{ parameters.databaseName }}
        sqlalchemyUri: ${{ parameters.sqlalchemyUri }}
        allowCtas: ${{ parameters.allowCtas }}
        allowCvas: ${{ parameters.allowCvas }}
        allowDml: ${{ parameters.allowDml }}
        allowFileUpload: ${{ parameters.allowFileUpload }}
        exposeInSqllab: ${{ parameters.exposeInSqllab }}
        impersonateUser: ${{ parameters.impersonateUser }}
        cacheTimeout: ${{ parameters.cacheTimeout }}
        sshTunnelServerAddress: ${{ parameters.sshTunnelServerAddress }}
        sshTunnelServerPort: ${{ parameters.sshTunnelServerPort }}
        sshTunnelUsername: ${{ parameters.sshTunnelUsername }}
        sshTunnelPassword: ${{ parameters.sshTunnelPassword }}
        extraJson: ${{ parameters.extraJson }}
  output:
    text:
      - title: Resultado
        content: |
          Conexión **${{ steps['create-connection'].output.databaseName }}**
          creada en Superset (id `${{ steps['create-connection'].output.id }}`).
---
