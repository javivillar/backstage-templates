            Camunda Modeler.
          type: string
          ui:widget: textarea
  steps:
    - id: update-process
      name: Redeploy process in Camunda
      action: camunda:update-process
      input:
        processKey: ${{ parameters.processKey }}
        bpmnXml: ${{ parameters.bpmnXml }}
  output:
    text:
      - title: Resultado
        content: |
          Proceso **${{ parameters.processKey }}** redesplegado en Camunda.
