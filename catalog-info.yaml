          type: string
        email:
          title: Email
          type: string
          format: email
        firstName:
          title: First name
          type: string
        lastName:
          title: Last name
          type: string
        groups:
          title: Groups
          description: Leave empty to leave membership unchanged, otherwise replaces it exactly.
          type: array
          items:
            type: string
  steps:
    - id: update-user
      name: Update user in Keycloak
      action: keycloak:update-user
      input:
        username: ${{ parameters.username }}
        email: ${{ parameters.email }}
        firstName: ${{ parameters.firstName }}
        lastName: ${{ parameters.lastName }}
        groups: ${{ parameters.groups }}
