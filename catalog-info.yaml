  title: Request DataHub vocabulary
  description: >-
    Need a domain, glossary term, tag or allowed value that does not exist yet? You cannot create it yourself (stewards
    curate the vocabulary). This opens a request for them. It refuses what already exists and does not duplicate an open request.
  tags: [datahub, governance, data]
spec:
  owner: group:default/backstage-admin
  type: datahub-governance
  parameters:
    - title: What do you need?
      required: [kind, name, description, justification]
      properties:
        kind:
          title: Kind
          type: string
          enum: [domain, glossaryTerm, tag, structuredPropertyValue]
          enumNames: [Domain, Glossary term, Tag, Allowed value of a structured property]
        name:
          title: Name
          type: string
        property:
          title: Structured property (only for "allowed value")
          description: e.g. refresquito.lawful_basis or refresquito.classification
          type: string
        description:
          title: Definition
          description: What it means, so a steward can define it precisely.
          type: string
          ui:widget: textarea
        justification:
          title: Why the existing vocabulary is not enough
          type: string
          ui:widget: textarea
        relatedProduct:
          title: Related data product (optional)
          type: string
        dryRun:
          title: Preview only
          description: Show the request that would be filed, without filing it.
          type: boolean
          default: true
  steps:
    - id: request
      name: File the request
      action: datahub:request-vocabulary
      input:
        kind: ${{ parameters.kind }}
        name: ${{ parameters.name }}
        property: ${{ parameters.property }}
        description: ${{ parameters.description }}
        justification: ${{ parameters.justification }}
        relatedProduct: ${{ parameters.relatedProduct }}
        dryRun: ${{ parameters.dryRun }}
  output:
    links:
      - title: Open the request
        url: ${{ steps['request'].output.issueUrl }}
    text:
      - title: Result
        content: |
          ${{ 'Preview only — nothing was filed.' if steps['request'].output.dryRun else ('This was already requested (open issue reused).' if steps['request'].output.alreadyRequested else 'Request filed for the data stewards.') }}

          ${{ steps['request'].output.title }}
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: refresquito-services-docs
  title: Servicios Refresquito — documentación
  description: >-
    Qué ofrece cada servicio de Refresquito desde Backstage, quién puede hacer qué
    y qué esperar de él. Pensada para quien desarrolla en la plataforma.
  tags: [documentation, refresquito]
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: documentation
  lifecycle: production
  owner: group:default/backstage-admin
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-framework-app
  title: New application (Python Framework)
  description: >-
    Creates a new business application built with the Python Framework of the platform (an Angular
    web, a FastAPI service and PostgreSQL, behind Keycloak) and proposes its deployment: the
    repository, a working copy of the petstore with the names you give here, its tests and its CI;
    its entry in the catalog; and a pull request to refresquito-services that, once merged, deploys
    it in the environments you choose with the platform blocks it uses.
  tags: [python-framework, fastapi, angular, postgresql]
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
    - title: The application
      required: [name, title, description]
      properties:
        name:
          title: Name
          description: >-
            Lowercase letters and digits, starting with a letter (no dashes). It names the
            repository, the Python package, the Keycloak client, the roles <name>-viewer and
            <name>-admin, the host <name>.<domain> and the namespace <zone>-<program>-<name>-oneke.
          type: string
          pattern: '^[a-z][a-z0-9]{2,30}$'
          ui:autofocus: true
        title:
          title: Title
          description: How people read it, e.g. Orders.
          type: string
          maxLength: 60
          pattern: '^[^"]+$'
        description:
          title: Description
          description: One sentence on what the application is for.
          type: string
          maxLength: 200
        system:
          title: Business service
          description: >-
            The System it implements: the business service of its specification in refresquito-specs (type business-service).
            Its Component, its instances and its blocks belong to it. Empty: a System named as the application (refresquito-services
            generates a minimal one until its specification exists).
          type: string
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: true
            defaultKind: System
            catalogFilter:
              kind: System
              spec.type: business-service
        systemInSpecs:
          title: Its business service already has a specification in refresquito-specs
          description: >-
            Off: refresquito-services generates a minimal System (type business-service) for it until its specification
            exists in refresquito-specs.
          type: boolean
          default: true
    - title: Its first entity
      description: >-
        The application starts with one entity (name, category, status and start date), with its
        list, its form and its API. Change it afterwards into what the application is about.
      required: [entity, entities]
      properties:
        entity:
          title: Entity, singular
          description: >-
            Lowercase letters only, e.g. order. It names the table and the class (Order). Not a name of a built-in type of
            TypeScript (record, map, set, date, error, event, promise, ...): the web would not compile.
          type: string
          pattern: '^(?!(?:record|partial|required|readonly|pick|omit|exclude|extract|map|set|weakmap|weakset|date|error|object|array|promise|string|number|boolean|symbol|function|event|node|element|response|request|headers|file|blob|document|window|location|history|storage|image|option|text|comment|range|selection|notification|worker|iterator|proxy|reflect|math|json|intl|regexp|uint)$)[a-z]{2,30}$'
        entities:
          title: Entity, plural
          description: Lowercase letters only, e.g. orders. It names the API path (/api/orders) and the page.
          type: string
          pattern: '^[a-z]{2,30}$'
    - title: Where it runs
      description: >-
        The application is deployed by Argo CD from refresquito-services. This template does not
        touch any cluster: it opens a pull request there, and merging it is what deploys.
      required: [environments, initialStage, frameworkVersion]
      properties:
        environments:
          title: Environments
          description: >-
            The clusters to deploy it in, as <zone>-<program>. More can be added later, in the file
            of the application (bootstrap/app-of-apps/apps/<name>.yaml of refresquito-services).
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            # one entry per cluster of the platform
            enum: [nato-sirtap]
          default: [nato-sirtap]
          ui:widget: checkboxes
        initialStage:
          title: Initial stage
          description: >-
            The stage it starts in. dev (the default): namespace <zone>-<program>-<name>-dev-oneke,
            https://<name>-dev.<domain>, its own Keycloak client <name>-dev and the test users <name>-dev-viewer and
            <name>-dev-admin. It moves on to pre and pro with the template "Promote an application".
            The data catalog (DataHub) is only for pro.
          type: string
          enum: [dev, pre, pro]
          default: dev
        frameworkVersion:
          title: Version of the Python Framework
          description: >-
            The maintained lines (its support policy: the latest major version, and the previous one for
            6 months). 3.3 brings the look of Refresquito (the Bootstrap theme, its blue, light and dark
            mode, and the layout rq-shell with the user and a menu by roles), shared with the Spring Framework;
            3.2 is maintained until 2027-04-28. 3.2 brings its own database, refresquito-postgres (PostgreSQL 18 without root and with
            no known vulnerability HIGH or CRITICAL), the same in the cluster, the CI and compose.yaml; 3.1 is
            maintained until 2027-04-23. 3.1 adds the dashboards (Superset embedded in the web, the data of its dataset)
            and the runs of its flows. 3.0 uses the platform blocks in its code (example code for each block marked
            below) and refuses tokens not issued for the application. 2.0 adds the audit trail, apart
            from the logs, with its metrics. 0.1 is maintained until 2027-04-15.
          type: string
          enum: ['3.3', '3.2', '3.1', '3.0', '2.0', '0.1']
          enumNames: ['3.3 (refresquito-fastapi 3.3.0, refresquito-angular 3.3.1, refresquito-postgres 3.3.0) - the look of Refresquito', '3.2 (refresquito-fastapi 3.2.0, refresquito-angular 3.2.0, refresquito-postgres 3.2.0) - its own database, PostgreSQL 18', '3.1 (refresquito-fastapi 3.1.2, refresquito-angular 3.1.1) - dashboards and flow runs', '3.0 (refresquito-fastapi 3.0.1, refresquito-angular 3.0.0) - platform blocks in the code', '2.0 (refresquito-fastapi 2.0.0, refresquito-angular 2.0.0) - audit trail', '0.1 (refresquito-fastapi 0.1.0, refresquito-angular 0.1.0)']
          default: '3.3'
    - title: Platform blocks
      description: >-
        What the application uses of the platform. Each block is created when the application is
        deployed, appears in the catalog as a resource of the application, and makes it depend on
        the service that provides it. Removing a block later never deletes what it created.
      properties:
        sso:
          title: Single sign-on (Keycloak)
          description: >-
            A public client named as the application, the realm roles <name>-viewer and
            <name>-admin, and one test user per role. Every application of the framework has it:
            the web signs in with it and the API reads the roles from the token.
          type: boolean
          default: true
          ui:readonly: true
        s3Buckets:
          title: Object storage (SeaweedFS, S3) - buckets
          description: >-
            Optional. One short name per bucket, e.g. documents: the application gets the bucket
            <name>-documents, an identity of its own allowed on its buckets only, and its access key
            in the environment of the API (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
            AWS_ENDPOINT_URL_S3, S3_BUCKETS). Empty, the application does not use object storage.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'
          default: []
        dmsSites:
          title: Documents (Alfresco) - sites
          description: >-
            Optional. One short name per site, e.g. documents: the application gets the private Alfresco
            site <name>-documents, a person of its own that works in it, and its credentials in the
            environment of the API (ALFRESCO_URL, ALFRESCO_USERNAME, ALFRESCO_PASSWORD, ALFRESCO_SITES).
            Empty, the application does not use Alfresco.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$'
          default: []
        dmsGroups:
          title: Documents (Alfresco) - groups of people who may enter its sites
          description: >-
            Keycloak groups (name or /path) whose members enter every site of the application, as
            Consumer the first time. Only used with sites. Empty, people are added later to the group
            alfrescodms-site-<name>-<site>.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        datahub:
          title: Data catalog (DataHub) - register its data
          description: >-
            A data product <program>-<name> in DataHub with one dataset per table of its database, read
            from its schema every hour (migrations show up by themselves), and its bucket, API, processes, flows,
            sites and dashboards inside it. Its team is the technical owner. Only in pro: in dev and pre it waits
            until the application is promoted to pro. Without it, its objects in the services go to the domain
            Plataforma, not to the application.
          type: boolean
          default: true
        dataClassification:
          title: Data catalog (DataHub) - classification of its data
          description: >-
            The classification of the data of the application, on the scale of the zone nato (lowest first), up to
            the ceiling of the cluster (NATO RESTRICTED in sirtap). Its tables, bucket, API, processes, flows and
            sites inherit it; platform/datahub.yaml can raise a table or a column. Only used with the data catalog.
          type: string
          enum: [INTERNAL, CONFIDENTIAL, NATO UNCLASSIFIED, NATO RESTRICTED]
          default: NATO UNCLASSIFIED
        dataReleasability:
          title: Data catalog (DataHub) - releasability
          description: Who its data may be released to, e.g. NATO, REL TO ESP, ESP ONLY. Empty = not declared. Only used with the data catalog.
          type: string
          pattern: '^[A-Z][A-Z0-9 ,/-]*$'
          default: NATO
        dataOwners:
          title: Data catalog (DataHub) - people who own its data
          description: User names of the realm, business owners of its data product. Only used with the data catalog.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]*$'
          default: []
        dataOwnerGroups:
          title: Data catalog (DataHub) - groups that own its data
          description: Keycloak groups (name or /path), business owners of its data product. Only used with the data catalog.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        gateway:
          title: API gateway (Gravitee) - publish its API
          description: >-
            Optional. Its API in Gravitee at /gateway/<name>/, public in the developer portal with its
            OpenAPI. Calls need a token of the realm from a subscribed Keycloak client; the web of the
            application is subscribed. The application gets nothing in its environment.
          type: boolean
          default: false
        gatewayTeam:
          title: API gateway (Gravitee) - team that sees it in Backstage
          description: Optional. A Keycloak group gravitee-team-<name>. Only used with the gateway.
          type: string
          pattern: '^(gravitee-team-[a-z0-9-]+)?$'
          default: ""
        processes:
          title: Processes (Camunda) - deploy its processes
          description: >-
            Optional. The BPMN in platform/processes/ of its repository (it starts with an example,
            <name>-review) are deployed in Camunda with each version. The API gets its own identity
            there (CAMUNDA_URL, CAMUNDA_USERNAME, CAMUNDA_PASSWORD) to start them and work their tasks.
          type: boolean
          default: false
        processGroups:
          title: Processes (Camunda) - groups that start them and work their tasks
          description: Keycloak groups (name or /path) whose members use them in Tasklist. Only used with processes.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        dashboards:
          title: Dashboards (Superset) - import its dashboards
          description: >-
            Optional. The Superset export in platform/dashboards/ of its repository (it starts with an
            example over its main table) is imported in Superset with each version, over its own database,
            read with a read-only role. The superset-editor and superset-admin groups see them. From the
            line 3.1 the application also comes with its page Dashboard (the dashboard embedded) and the data
            of its dataset in its API (dashboards.py).
          type: boolean
          default: false
        flows:
          title: Flows (Activepieces) - import its flows
          description: >-
            Optional. The flows in platform/flows/ of its repository (one exported flow per file; it starts
            with an example, new-<entity>, a webhook) are imported in an Activepieces project of its own with
            each version, and published once complete. The API gets the webhook of each one
            (ACTIVEPIECES_FLOW_<FLOW>_URL).
          type: boolean
          default: false
        flowGroups:
          title: Flows (Activepieces) - groups that edit them
          description: Keycloak groups (name or /path) whose members are editors of its project. Only used with flows.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$'
          default: []
        monitoring:
          title: Monitoring (Prometheus, Grafana) - its metrics and dashboards
          description: >-
            Prometheus scrapes the metrics of its API, and Grafana gets in Applications/<name>/<stage> the dashboards
            <title> - Logs (levels, errors, failed requests, the lines) and <title> - Performance (traffic,
            errors, latency per route, CPU and memory) of each stage, plus the ones in platform/monitoring/
            of its repository. Off: nothing of it is scraped and it gets no dashboards.
          type: boolean
          default: true
        admins:
          title: People who get the role <name>-admin
          description: User names of the realm (they must exist; nobody is created). Empty, only the test user has it.
          type: array
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{0,60}$'
          default: []
    - title: Repository
      properties:
        owner:
          title: GitHub owner
          description: User or organization that will own the repository <owner>/<name>. It is created private.
          type: string
          default: javivillar
        dataStewards:
          title: Data stewards
          description: >-
            GitHub users (@user, separated by spaces) who approve the exceptions to the classification of its data:
            the CODEOWNERS of platform/datahub-exceptions.yaml. The data stewards of the program, not the team of the
            application.
          type: string
          pattern: '^@[A-Za-z0-9-]+( @[A-Za-z0-9-]+)*$'
          default: "@javivillar"
        securityApprovers:
          title: Security approvers
          description: >-
            GitHub users (@user, separated by spaces) who approve the exceptions to the checks of Quality & Security
            (an accepted vulnerability, a public endpoint...): the CODEOWNERS of platform/security-exceptions.yaml.
            The security of the program, not the team of the application.
          type: string
          pattern: '^@[A-Za-z0-9-]+( @[A-Za-z0-9-]+)*$'
          default: "@javivillar"
  steps:
    - id: fetch
      name: Generate the application from the skeleton
      action: fetch:template
      input:
        # one skeleton per line of the framework (tools/make-python-app-skeleton.py writes them)
        url: ./skeletons/python-framework-app-${{ parameters.frameworkVersion }}
        targetPath: ./app
        # binaries, the lock file, and files with a ${...} syntax of their own
        copyWithoutTemplating:
          - vendor/**
          - frontend/package-lock.json
          - frontend/public/favicon.ico
          - .github/workflows/**
          - .github/quality.py
          - .github/endpoints.py
          - backend/migrations/script.py.mako
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          entity: ${{ parameters.entity }}
          entityTitle: ${{ parameters.entity | capitalize }}
          entities: ${{ parameters.entities }}
          entitiesTitle: ${{ parameters.entities | capitalize }}
          owner: ${{ parameters.owner }}
          # its business service (System), in catalog-info.yaml and in the file of the application
          system: "${{ (parameters.system | parseEntityRef({ defaultKind: 'system', defaultNamespace: 'default' }) | pick('name')) if parameters.system else parameters.name }}"
          # 3.0: the example code of each platform block marked (the older skeletons do not read them)
          processes: ${{ parameters.processes }}
          flows: ${{ parameters.flows }}
          buckets: ${{ parameters.s3Buckets }}
          sites: ${{ parameters.dmsSites }}
          # 3.1: its dashboard embedded (page Dashboard, dashboards.py)
          dashboards: ${{ parameters.dashboards }}
          # 3.1: who approves the exceptions to the classification of its data (.github/CODEOWNERS)
          dataStewards: ${{ parameters.dataStewards }}
          securityApprovers: ${{ parameters.securityApprovers }}
    - id: publish
      name: Create the repository
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.owner }}&repo=${{ parameters.name }}
        sourcePath: ./app
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        gitCommitMessage: '${{ parameters.name }} 0.1.0: created from the template "New application (Python Framework)"'
    - id: register
      name: Register in the Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        # The location is added first; then the action reads the file back from GitHub only to name the entity of
        # the link "Open in the catalog". A dropped connection there (ECONNRESET) stopped the whole template before
        # the deployment pull request. Optional: the template goes on, and the catalog reads the location by itself.
        optional: true
        catalogInfoPath: '/catalog-info.yaml'
    # The deployment is GitOps: two files in refresquito-services (the file of the application and
    # the definition of its API), proposed as a pull request. Merging it is what deploys.
    - id: deployment
      name: Prepare the deployment (the file of the application)
      action: fetch:template
      input:
        url: ./skeletons/python-framework-deploy
        targetPath: ./deploy
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          entity: ${{ parameters.entity }}
          entityTitle: ${{ parameters.entity | capitalize }}
          entities: ${{ parameters.entities }}
          entitiesTitle: ${{ parameters.entities | capitalize }}
          owner: ${{ parameters.owner }}
          # its business service (System), in catalog-info.yaml and in the file of the application
          system: "${{ (parameters.system | parseEntityRef({ defaultKind: 'system', defaultNamespace: 'default' }) | pick('name')) if parameters.system else parameters.name }}"
          # false: the app-of-apps generates a minimal System for it (no specification yet)
          systemInSpecs: ${{ parameters.systemInSpecs }}
          environments: ${{ parameters.environments }}
          admins: ${{ parameters.admins }}
          buckets: ${{ parameters.s3Buckets }}
          sites: ${{ parameters.dmsSites }}
          siteGroups: ${{ parameters.dmsGroups }}
          datahub: ${{ parameters.datahub }}
          dataClassification: ${{ parameters.dataClassification }}
          dataReleasability: ${{ parameters.dataReleasability }}
          dataOwners: ${{ parameters.dataOwners }}
          dataOwnerGroups: ${{ parameters.dataOwnerGroups }}
          gateway: ${{ parameters.gateway }}
          gatewayTeam: ${{ parameters.gatewayTeam }}
          processes: ${{ parameters.processes }}
          processGroups: ${{ parameters.processGroups }}
          dashboards: ${{ parameters.dashboards }}
          flows: ${{ parameters.flows }}
          flowGroups: ${{ parameters.flowGroups }}
          monitoring: ${{ parameters.monitoring }}
          # the commit just pushed: its CI builds the two images with that tag
          tag: ${{ steps['publish'].output.commitHash }}
          stage: ${{ parameters.initialStage }}
          # the versions in vendor/ of the skeleton of that line (tools/make-python-app-skeleton.py, LINES)
          fastapi: ${{ '3.1.2' if parameters.frameworkVersion == '3.1' else ('3.0.1' if parameters.frameworkVersion == '3.0' else (parameters.frameworkVersion + '.0')) }}
          angular: ${{ '3.1.1' if parameters.frameworkVersion == '3.1' else ('3.3.1' if parameters.frameworkVersion == '3.3' else (parameters.frameworkVersion + '.0')) }}
          # its database, from 3.2 (POSTGRES of the tool): the chart deploys refresquito-postgres of that version
          postgres: ${{ (parameters.frameworkVersion + '.0') if parameters.frameworkVersion in ['3.2', '3.3'] else '' }}
    - id: deploy
      name: Open the deployment pull request in refresquito-services
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: deploy-${{ parameters.name }}
        targetBranchName: main
        sourcePath: ./deploy
        title: 'Deploy ${{ parameters.name }} (${{ parameters.title }}) in ${{ parameters.environments | join(", ") }}, stage ${{ parameters.initialStage }}'
        commitMessage: '${{ parameters.name }}: a new application of the Python Framework, deployed in ${{ parameters.environments | join(", ") }} (stage ${{ parameters.initialStage }})'
        description: |
          **${{ parameters.title }}**: ${{ parameters.description }}

          Created with the Backstage template "New application (Python Framework)": repository
          [${{ parameters.owner }}/${{ parameters.name }}](https://github.com/${{ parameters.owner }}/${{ parameters.name }}), commit `${{ steps['publish'].output.commitHash }}`.

          Merging this deploys it, with no pass of the bootstrap:

          | | |
          |---|---|
          | Environments | ${{ parameters.environments | join(", ") }} |
          | Stage | ${{ parameters.initialStage }} (it moves on with the template "Promote an application") |
          | Namespace | `<zone>-<program>-${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-oneke` |
          | URL | `https://${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}.<domain>` |
          | Images | `ghcr.io/${{ parameters.owner }}/${{ parameters.name }}-api` and `-web`, tag of that commit (its CI must have finished) |
          | Platform blocks | `sso`: client `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}`, roles `${{ parameters.name }}-viewer` and `${{ parameters.name }}-admin`, their test users{% if parameters.s3Buckets | length %}. `s3`: buckets ${{ parameters.s3Buckets | join(", ") }} (each one as `${{ parameters.name }}-<bucket>`){% endif %}{% if parameters.dmsSites | length %}. `dms`: Alfresco sites ${{ parameters.dmsSites | join(", ") }} (each one as `${{ parameters.name }}-<site>`){% endif %}{% if parameters.datahub %}. `datahub`: data product with the tables of its database, ${{ parameters.dataClassification }}{% if parameters.initialStage != 'pro' %} (only once it is in pro){% endif %}{% endif %}{% if parameters.gateway %}. `gateway`: its API at `/gateway/${{ parameters.name }}/` in Gravitee{% endif %}{% if parameters.processes %}. `processes`: its BPMN of `platform/processes/` in Camunda{% endif %}{% if parameters.dashboards %}. `dashboards`: its Superset export of `platform/dashboards/`{% endif %}{% if parameters.flows %}. `flows`: its Activepieces flows of `platform/flows/`{% endif %}{% if parameters.monitoring %}. `monitoring`: its metrics in Prometheus, dashboards Logs and Performance in Applications/<name>/<stage> of Grafana{% endif %} |
          | Python Framework | ${{ parameters.frameworkVersion }} |

          Files: `bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml` (what it is and what it uses) and
          `catalog/apis/${{ parameters.name }}.json` (its API, for the catalog). See `charts/python-app-oneke/INSTALL.md`.
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Deployment pull request
        url: ${{ steps['deploy'].output.remoteUrl }}
      - title: Open in the catalog
        icon: catalog
        url: /console/entity/default/component/${{ parameters.name }}
    text:
      - title: Next - merge the deployment pull request
        content: |
          The repository exists and its CI is building the two images of commit `${{ steps['publish'].output.commitHash }}`.

          Its deployment is proposed in a **pull request of refresquito-services** (the link above). Once the CI of the
          application has finished, merging that pull request deploys it: Argo CD creates
          `<zone>-<program>-${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-oneke` in ${{ parameters.environments | join(", ") }} (stage **${{ parameters.initialStage }}**), and
          within a few minutes the application answers on `https://${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}.<domain>` with its Keycloak client
          `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}`, its roles and the test users `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-admin` and `${{ parameters.name if parameters.initialStage == 'pro' else (parameters.name + '-' + parameters.initialStage) }}-viewer`.

          Nothing else is needed: no command to run and no pass of the bootstrap. To roll out a later commit, or to move it on
          to pre and pro, use the template **Promote an application**.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-framework-promote
  title: Promote an application
  description: >-
    Moves a version of an application of the Python Framework or of the Spring Framework to a stage (dev, pre or pro): the tag of one stage,
    or a commit of its repository, becomes the tag of the stage you choose. It opens a pull request to
    refresquito-services that changes only that line of the file of the application; merging it deploys that
    version in that stage (each stage is a namespace of its own in the same cluster).
  tags:
    - python-framework
    - spring-framework
    - promotion
    - gitops
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
    - title: What to promote
      required:
        - name
        - source
        - target
      properties:
        name:
          title: Application
          description: Its name, as in bootstrap/app-of-apps/apps/<name>.yaml of refresquito-services (e.g. orders).
          type: string
          pattern: ^[a-z][a-z0-9]{2,30}$
          ui:autofocus: true
        source:
          title: From
          description: The stage whose version moves on, or a commit of the application (to start a new version, usually in dev).
          type: string
          enum: [dev, pre, commit]
          enumNames: ["the version of dev", "the version of pre", "a commit of its repository"]
          default: dev
        target:
          title: To
          description: The stage that takes that version. dev and pre are namespaces <zone>-<program>-<name>-<stage>-oneke on https://<name>-<stage>.<domain>; pro is the application itself.
          type: string
          enum: [dev, pre, pro]
          default: pro
        datahub:
          title: Data catalog (DataHub) - register its data
          description: >-
            Only when it goes to pro and its file has no block datahub yet: adds it, so its tables, bucket, API,
            processes, flows, sites and dashboards go to its data product in DataHub (without it they go to the domain
            Plataforma). An application that already has the block keeps it as it is.
          type: boolean
          default: true
        dataClassification:
          title: Data catalog (DataHub) - classification of its data
          description: On the scale of the zone nato, up to the ceiling of the cluster (NATO RESTRICTED in sirtap). Only used when the block is added.
          type: string
          enum: [INTERNAL, CONFIDENTIAL, NATO UNCLASSIFIED, NATO RESTRICTED]
          default: NATO UNCLASSIFIED
        dataReleasability:
          title: Data catalog (DataHub) - releasability
          description: Who its data may be released to, e.g. NATO, REL TO ESP. Empty = not declared. Only used when the block is added.
          type: string
          pattern: '^([A-Z][A-Z0-9 ,/-]*)?$'
          default: NATO
      dependencies:
        source:
          oneOf:
            - properties:
                source: { enum: [commit] }
                commit:
                  title: Commit
                  description: The commit of the application whose images to deploy (its CI must have published them).
                  type: string
                  pattern: ^[0-9a-f]{7,40}$
              required: [commit]
            - properties:
                source: { enum: [dev, pre] }
  steps:
    - id: fetch
      name: Read the file of the application
      action: fetch:plain:file
      input:
        url: https://github.com/javivillar/refresquito-services/blob/main/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
        targetPath: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml

    - id: parse
      name: Find the tag of each stage
      action: roadiehq:utils:fs:parse
      input:
        path: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
        parser: yaml

    # Only the line of the stage changes: the file keeps its comments and its order.
    - id: first-stage
      name: Move it to stages (it had only pro, in image.tag)
      if: ${{ not steps['parse'].output.content.stages and parameters.target != "pro" }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nimage:\n  registry: [^\n]*\n)  tag: "([^"]*)"[^\n]*\n'
            replaceWith: "$1# its stages (dev, pre, pro), each a deployment of its own; the template Promote moves a tag on\nstages:\n  pro: { tag: \"$2\" }\n"

    - id: set-image
      name: Set the tag of pro (it has only pro, in image.tag)
      if: ${{ not steps['parse'].output.content.stages and parameters.target == "pro" }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nimage:\n  registry: [^\n]*\n  tag: )"[^"]*"'
            replaceWith: "$1\"${{ parameters.commit if parameters.source == 'commit' else '' }}\""

    - id: set
      name: Set the tag of ${{ parameters.target }}
      if: ${{ steps['parse'].output.content.stages and steps['parse'].output.content.stages[parameters.target] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\n  ${{ parameters.target }}: \{ tag: )"[^"]*"'
            replaceWith: "$1\"${{ parameters.commit if parameters.source == 'commit' else steps['parse'].output.content.stages[parameters.source].tag }}\""

    - id: add
      name: Add the stage ${{ parameters.target }}
      if: ${{ (steps['parse'].output.content.stages and not steps['parse'].output.content.stages[parameters.target]) or (not steps['parse'].output.content.stages and parameters.target != "pro") }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nstages:\n)'
            replaceWith: "$1  ${{ parameters.target }}: { tag: \"${{ parameters.commit if parameters.source == 'commit' else (steps['parse'].output.content.stages[parameters.source].tag if steps['parse'].output.content.stages else '') }}\" }\n"

    # pro without the block datahub: it gets one, so its data is in DataHub as part of the application
    - id: datahub
      name: Add the block datahub (it goes to pro without it)
      if: ${{ parameters.target == "pro" and parameters.datahub and not (steps['parse'].output.content.platform and steps['parse'].output.content.platform.datahub) }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: ./promote/bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml
            matchRegex: true
            find: '(\nplatform:\n)'
            replaceWith: "$1  datahub:\n    enabled: true\n    classification: \"${{ parameters.dataClassification }}\"\n    releasability: \"${{ parameters.dataReleasability }}\"\n"

    - id: promote
      name: Open the pull request in refresquito-services
      # nothing to promote when the stage it moves from has no version
      if: ${{ parameters.source == 'commit' or (steps['parse'].output.content.stages and steps['parse'].output.content.stages[parameters.source]) }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: promote-${{ parameters.name }}-${{ parameters.target }}
        targetBranchName: main
        sourcePath: ./promote
        update: true
        title: >-
          Promote ${{ parameters.name }} to ${{ parameters.target }}
          (${{ ("commit " + parameters.commit | truncate(12, true, "")) if parameters.source == "commit" else ("the version of " + parameters.source) }})
        commitMessage: >-
          ${{ parameters.name }}: ${{ parameters.target }} takes
          ${{ ("commit " + parameters.commit) if parameters.source == "commit" else ("the version of " + parameters.source) }}
        description: |
          **${{ parameters.name }}**: the stage **${{ parameters.target }}** takes
          ${{ ("the commit `" + parameters.commit + "`") if parameters.source == "commit" else ("the version of **" + parameters.source + "**, commit `" + (steps["parse"].output.content.stages[parameters.source].tag if steps["parse"].output.content.stages else "?") + "`") }}.

          Created with the Backstage template "Promote an application". It changes
          `stages.${{ parameters.target }}.tag` in `bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml`${{ (", and adds the block `datahub` (classification " + parameters.dataClassification + ") if it had none") if (parameters.target == "pro" and parameters.datahub) else "" }}
          (see *Stages* in `charts/python-app-oneke/INSTALL.md`, the same for `charts/spring-app-oneke`). Merging it deploys that version: Argo CD rolls out
          `${{ parameters.name if parameters.target == "pro" else (parameters.name + "-" + parameters.target) }}-oneke`
          on `https://${{ parameters.name if parameters.target == "pro" else (parameters.name + "-" + parameters.target) }}.<domain>`.
          The CI of this pull request renders the stack: it fails when the stage it moves from has no version.

  output:
    links:
      - title: Promotion pull request
        url: ${{ steps['promote'].output.remoteUrl }}
    text:
      - title: ${{ 'Next - review and merge the pull request' if steps['promote'].output.remoteUrl else 'Nothing was promoted' }}
        content: |
          ${{ ('Merging the pull request deploys the version in **' + parameters.target + '**; Argo CD does it within a few minutes, with no pass of the bootstrap. The tags of the other stages do not change.') if steps['promote'].output.remoteUrl else ('**' + parameters.name + '** has no version in **' + parameters.source + '**: no pull request was opened. Put a commit there first (From: a commit of its repository).') }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: developer-assistant-implement
  title: Implement a change (Developer Assistant)
  description: >-
    The developer assistant implements a change of an approved specification in the application its approved
    architecture instantiated: plan breaks the specification down into the tasks of the OpenSpec change, each one
    marked pure development, a Refresquito service, or a person; implement builds the tasks not done, with tests
    from its scenarios. It runs as the workflow develop of refresquito-specs (Claude Code on the operator's
    subscription) and leaves DRAFT pull requests — the code in the application, the tasks done in refresquito-specs —
    for a person to review and merge. Only the operator may run it for now.
  tags:
    - developer-assistant
    - python-framework
    - openspec
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
    - title: What to implement
      required:
        - system
        - change
        - mode
      properties:
        system:
          title: System
          description: The system of refresquito-specs; its specification and its architecture must be approved (merged), and its application instantiated (section 5.6 of its Architecture Design).
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
        change:
          title: Change
          description: The change of its specification, as its folder docs/openspec/changes/<change> (e.g. new-orders).
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,60}$
        mode:
          title: Mode
          type: string
          enum: [implement, plan]
          enumNames: ["implement: build the tasks not done", "plan: break the specification down into tasks.md (OpenSpec), each task dev, service or person"]
          default: implement
        group:
          title: Group of tasks
          description: Only this group of tasks.md (its number), one pull request to review; empty = every task not done.
          type: string
          pattern: ^[0-9]*$
          default: ""
        instructions:
          title: Instructions (optional)
          description: >-
            What you ask the assistant for this run, besides its fixed instructions (e.g. "break it down by role",
            "the API first, the web in the last groups", "smaller tasks"). It is added at the end of its instructions and
            never lifts one of their rules.
          type: string
          maxLength: 4000
          default: ""
          ui:widget: textarea
          ui:options:
            rows: 5
        model:
          title: Model
          type: string
          enum: [claude-opus-5-5, claude-sonnet-5-5]
          default: claude-opus-5-5
  steps:
    - id: dispatch
      name: Start the developer assistant (workflow develop of refresquito-specs)
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=refresquito-specs&owner=javivillar
        workflowId: develop.yml
        branchOrTagName: main
        workflowInputs:
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          change: ${{ parameters.change }}
          mode: ${{ parameters.mode }}
          group: ${{ parameters.group }}
          instructions: ${{ parameters.instructions }}
          model: ${{ parameters.model }}
          # who asked for it: the cost of the run is charged to them, its application and its system (page Costs)
          requested_by: ${{ user.ref }}
  output:
    links:
      - title: The runs of the developer assistant
        url: https://github.com/javivillar/refresquito-specs/actions/workflows/develop.yml
      - title: The change
        url: https://github.com/javivillar/refresquito-specs/tree/main/systems/${{ parameters.system | parseEntityRef | pick('name') }}/docs/openspec/changes/${{ parameters.change }}
    text:
      - title: Next - follow the run, then review the pull requests
        content: |
          The assistant runs on GitHub Actions (minutes to an hour or more). When it ends, its **draft** pull requests are
          in the repository of the application (the code) and in refresquito-specs (the tasks done); their description
          says what it did, the tests and any question. Review them like any pull request: **merging is approving**.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-framework-app
  title: New application (Spring Framework)
  description: 'Creates a new business application built with the Spring Framework of the platform (an Angular web and Spring Boot services, each
    with its own PostgreSQL, with events between them, behind Keycloak) and proposes its deployment: the repository, a working copy of petstore-spring
    with the names you give here, its tests and its CI; its entry in the catalog; and a pull request to refresquito-services that, once merged,
    deploys it in the environments you choose with the platform blocks it uses.'
  tags:
  - spring-framework
  - spring-boot
  - angular
  - postgresql
  - microservices
spec:
  owner: group:default/backstage-admin
  type: service
  parameters:
  - title: The application
    required:
    - name
    - title
    - description
    properties:
      name:
        title: Name
        description: Lowercase letters and digits, starting with a letter (no dashes). It names the repository, the Java package (io.refresquito.<name>),
          the Keycloak client, the roles <name>-viewer and <name>-admin, the host <name>.<domain> and the namespace <zone>-<program>-<name>-oneke.
        type: string
        pattern: ^[a-z][a-z0-9]{2,30}$
        ui:autofocus: true
      title:
        title: Title
        description: How people read it, e.g. Orders.
        type: string
        maxLength: 60
        pattern: ^[^"]+$
      description:
        title: Description
        description: One sentence on what the application is for.
        type: string
        maxLength: 200
      system:
        title: Business service
        description: >-
          The System it implements: the business service of its specification in refresquito-specs (type business-service).
          Its Component, its instances and its blocks belong to it. Empty: a System named as the application (refresquito-services
          generates a minimal one until its specification exists).
        type: string
        ui:field: EntityPicker
        ui:options:
          allowArbitraryValues: true
          defaultKind: System
          catalogFilter:
            kind: System
            spec.type: business-service
      systemInSpecs:
        title: Its business service already has a specification in refresquito-specs
        description: >-
          Off: refresquito-services generates a minimal System (type business-service) for it until its specification
          exists in refresquito-specs.
        type: boolean
        default: true
  - title: Its first entity
    description: 'The application starts with one entity (name, category, status and start date), with its list, its form and its service: services/<entities>,
      with its own database, which publishes its events; and the service notifier, which handles them. Change it afterwards into what the application
      is about, and add services as it grows.'
    required:
    - entity
    - entities
    properties:
      entity:
        title: Entity, singular
        description: 'Lowercase letters only, e.g. order. It names the table and the class (Order). Not a name of a built-in type of TypeScript
          (record, map, set, date, error, event, promise, ...): the web would not compile.'
        type: string
        pattern: ^(?!(?:record|partial|required|readonly|pick|omit|exclude|extract|map|set|weakmap|weakset|date|error|object|array|promise|string|number|boolean|symbol|function|event|node|element|response|request|headers|file|blob|document|window|location|history|storage|image|option|text|comment|range|selection|notification|worker|iterator|proxy|reflect|math|json|intl|regexp|uint)$)[a-z]{2,30}$
      entities:
        title: Entity, plural
        description: Lowercase letters only, e.g. orders. It names the service (services/orders, its database and its image), the API path (/api/orders)
          and the page.
        type: string
        pattern: ^[a-z]{2,30}$
  - title: Where it runs
    description: 'The application is deployed by Argo CD from refresquito-services. This template does not touch any cluster: it opens a pull
      request there, and merging it is what deploys.'
    required:
    - environments
    - initialStage
    - frameworkVersion
    properties:
      environments:
        title: Environments
        description: The clusters to deploy it in, as <zone>-<program>. More can be added later, in the file of the application (bootstrap/app-of-apps/apps/<name>.yaml
          of refresquito-services).
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - nato-sirtap
        default:
        - nato-sirtap
        ui:widget: checkboxes
      initialStage:
        title: Initial stage
        description: 'The stage it starts in. dev (the default): namespace <zone>-<program>-<name>-dev-oneke, https://<name>-dev.<domain>, its
          own Keycloak client <name>-dev and the test users <name>-dev-viewer and <name>-dev-admin. It moves on to pre and pro with the template
          "Promote an application" (the same for both frameworks). The data catalog (DataHub) is only for pro.'
        type: string
        enum:
        - dev
        - pre
        - pro
        default: dev
      frameworkVersion:
        title: Version of the Spring Framework
        description: 'The maintained lines of the Spring Framework (its support policy, as the Python one: the latest major version, and the previous
          one for 6 months). 1.0 is the first: Spring Boot 4.1 and Java 25 (refresquito-spring-boot), the web of refresquito-angular 3.3 (the
          look of Refresquito, shared with the Python Framework) and refresquito-postgres 3.3 (PostgreSQL 18) for the database of each service;
          events between services (RabbitMQ, with an outbox), calls between services with the token of the user, and the images on Docker Hardened
          Images.'
        type: string
        enum:
        - '1.0'
        enumNames:
        - 1.0 (refresquito-spring-boot 1.0.0, refresquito-angular 3.3.1, refresquito-postgres 3.3.0) - microservices on Spring Boot 4.1 and Java
          25
        default: '1.0'
  - title: Platform blocks
    description: What the application uses of the platform. Each block is created when the application is deployed, appears in the catalog as
      a resource of the application, and makes it depend on the service that provides it. Removing a block later never deletes what it created.
    properties:
      sso:
        title: Single sign-on (Keycloak)
        description: 'A public client named as the application, the realm roles <name>-viewer and <name>-admin, and one test user per role. Every
          application of the framework has it: the web signs in with it and its services read the roles from the token.'
        type: boolean
        default: true
        ui:readonly: true
      s3Buckets:
        title: Object storage (SeaweedFS, S3) - buckets
        description: 'Optional. One short name per bucket, e.g. documents: the application gets the bucket <name>-documents, an identity of its
          own allowed on its buckets only, and its access key in the environment of its services (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3,
          S3_BUCKETS). Empty, the application does not use object storage.'
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$
        default: []
      dmsSites:
        title: Documents (Alfresco) - sites
        description: 'Optional. One short name per site, e.g. documents: the application gets the private Alfresco site <name>-documents, a person
          of its own that works in it, and its credentials in the environment of its services (ALFRESCO_URL, ALFRESCO_USERNAME, ALFRESCO_PASSWORD,
          ALFRESCO_SITES). Empty, the application does not use Alfresco.'
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$
        default: []
      dmsGroups:
        title: Documents (Alfresco) - groups of people who may enter its sites
        description: Keycloak groups (name or /path) whose members enter every site of the application, as Consumer the first time. Only used
          with sites. Empty, people are added later to the group alfrescodms-site-<name>-<site>.
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$
        default: []
      datahub:
        title: Data catalog (DataHub) - register its data
        description: 'A data product <program>-<name> in DataHub with one dataset per table of its database, read from its schema every hour (migrations
          show up by themselves), and its bucket, API, processes, flows, sites and dashboards inside it. Its team is the technical owner. Only
          in pro: in dev and pre it waits until the application is promoted to pro. Without it, its objects in the services go to the domain Plataforma,
          not to the application.'
        type: boolean
        default: true
      dataClassification:
        title: Data catalog (DataHub) - classification of its data
        description: The classification of the data of the application, on the scale of the zone nato (lowest first), up to the ceiling of the
          cluster (NATO RESTRICTED in sirtap). Its tables, bucket, API, processes, flows and sites inherit it; platform/datahub.yaml can raise
          a table or a column. Only used with the data catalog.
        type: string
        enum:
        - INTERNAL
        - CONFIDENTIAL
        - NATO UNCLASSIFIED
        - NATO RESTRICTED
        default: NATO UNCLASSIFIED
      dataReleasability:
        title: Data catalog (DataHub) - releasability
        description: Who its data may be released to, e.g. NATO, REL TO ESP, ESP ONLY. Empty = not declared. Only used with the data catalog.
        type: string
        pattern: ^[A-Z][A-Z0-9 ,/-]*$
        default: NATO
      dataOwners:
        title: Data catalog (DataHub) - people who own its data
        description: User names of the realm, business owners of its data product. Only used with the data catalog.
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._@-]*$
        default: []
      dataOwnerGroups:
        title: Data catalog (DataHub) - groups that own its data
        description: Keycloak groups (name or /path), business owners of its data product. Only used with the data catalog.
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$
        default: []
      gateway:
        title: API gateway (Gravitee) - publish its API
        description: Optional. The API of its first service in Gravitee at /gateway/<name>/, public in the developer portal with its OpenAPI.
          Calls need a token of the realm from a subscribed Keycloak client; the web of the application is subscribed. The application gets nothing
          in its environment.
        type: boolean
        default: false
      gatewayTeam:
        title: API gateway (Gravitee) - team that sees it in Backstage
        description: Optional. A Keycloak group gravitee-team-<name>. Only used with the gateway.
        type: string
        pattern: ^(gravitee-team-[a-z0-9-]+)?$
        default: ''
      processes:
        title: Processes (Camunda) - deploy its processes
        description: Optional. The BPMN in platform/processes/ of its repository (it starts with an example, <name>-review) are deployed in Camunda
          with each version. Its services get their own identity there (CAMUNDA_URL, CAMUNDA_USERNAME, CAMUNDA_PASSWORD) to start them and work
          their tasks.
        type: boolean
        default: false
      processGroups:
        title: Processes (Camunda) - groups that start them and work their tasks
        description: Keycloak groups (name or /path) whose members use them in Tasklist. Only used with processes.
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$
        default: []
      dashboards:
        title: Dashboards (Superset) - import its dashboards
        description: Optional. The Superset export in platform/dashboards/ of its repository (it starts with an example over its main table) is
          imported in Superset with each version, over its own database, read with a read-only role. The superset-editor and superset-admin groups
          see them. The application also comes with its page Dashboard (the dashboard embedded) and the data of its dataset in its service (DashboardsController).
        type: boolean
        default: false
      flows:
        title: Flows (Activepieces) - import its flows
        description: Optional. The flows in platform/flows/ of its repository (one exported flow per file; it starts with an example, new-<entity>,
          a webhook) are imported in an Activepieces project of its own with each version, and published once complete. Its services start them
          with the framework (Flows), by their name or by an event.
        type: boolean
        default: false
      flowGroups:
        title: Flows (Activepieces) - groups that edit them
        description: Keycloak groups (name or /path) whose members are editors of its project. Only used with flows.
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^/?[A-Za-z0-9][A-Za-z0-9 ._/-]*$
        default: []
      monitoring:
        title: Monitoring (Prometheus, Grafana) - its metrics and dashboards
        description: 'Prometheus scrapes the metrics of each of its services, and Grafana gets in Applications/<name>/<stage> the dashboards <title> - Logs,
          <title> - Audit and <title> - Performance (traffic, errors, latency per route, the JVM, the calls between its services, its events,
          CPU and memory) of each stage, with a selector of the service, plus the ones in platform/monitoring/ of its repository. Off: nothing
          of it is scraped and it gets no dashboards.'
        type: boolean
        default: true
      admins:
        title: People who get the role <name>-admin
        description: User names of the realm (they must exist; nobody is created). Empty, only the test user has it.
        type: array
        items:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,60}$
        default: []
  - title: Repository
    properties:
      owner:
        title: GitHub owner
        description: User or organization that will own the repository <owner>/<name>. It is created private.
        type: string
        default: javivillar
      dataStewards:
        title: Data stewards
        description: 'GitHub users (@user, separated by spaces) who approve the exceptions to the classification of its data: the CODEOWNERS of
          platform/datahub-exceptions.yaml. The data stewards of the program, not the team of the application.'
        type: string
        pattern: ^@[A-Za-z0-9-]+( @[A-Za-z0-9-]+)*$
        default: '@javivillar'
      securityApprovers:
        title: Security approvers
        description: 'GitHub users (@user, separated by spaces) who approve the exceptions to the checks of Quality & Security (an accepted vulnerability,
          a public endpoint...): the CODEOWNERS of platform/security-exceptions.yaml. The security of the program, not the team of the application.'
        type: string
        pattern: ^@[A-Za-z0-9-]+( @[A-Za-z0-9-]+)*$
        default: '@javivillar'
  steps:
  - id: fetch
    name: Generate the application from the skeleton
    action: fetch:template
    input:
      url: ./skeletons/spring-framework-app-${{ parameters.frameworkVersion }}
      targetPath: ./app
      copyWithoutTemplating:
      - vendor/**
      - frontend/package-lock.json
      - frontend/public/favicon.ico
      - .github/workflows/**
      - .github/quality.py
      values:
        name: ${{ parameters.name }}
        title: ${{ parameters.title }}
        description: ${{ parameters.description }}
        entity: ${{ parameters.entity }}
        entityTitle: ${{ parameters.entity | capitalize }}
        entities: ${{ parameters.entities }}
        entitiesTitle: ${{ parameters.entities | capitalize }}
        owner: ${{ parameters.owner }}
        # its business service (System), in catalog-info.yaml and in the file of the application
        system: "${{ (parameters.system | parseEntityRef({ defaultKind: 'system', defaultNamespace: 'default' }) | pick('name')) if parameters.system else parameters.name }}"
        processes: ${{ parameters.processes }}
        flows: ${{ parameters.flows }}
        buckets: ${{ parameters.s3Buckets }}
        sites: ${{ parameters.dmsSites }}
        dashboards: ${{ parameters.dashboards }}
        dataStewards: ${{ parameters.dataStewards }}
        securityApprovers: ${{ parameters.securityApprovers }}
  - id: publish
    name: Create the repository
    action: publish:github
    input:
      repoUrl: github.com?owner=${{ parameters.owner }}&repo=${{ parameters.name }}
      sourcePath: ./app
      description: ${{ parameters.description }}
      defaultBranch: main
      repoVisibility: private
      gitCommitMessage: '${{ parameters.name }} 0.1.0: created from the template "New application (Spring Framework)"'
  - id: register
    name: Register in the Backstage catalog
    action: catalog:register
    input:
      repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
      optional: true
      catalogInfoPath: /catalog-info.yaml
  - id: deployment
    name: Prepare the deployment (the file of the application)
    action: fetch:template
    input:
      url: ./skeletons/spring-framework-deploy
      targetPath: ./deploy
      values:
        name: ${{ parameters.name }}
        title: ${{ parameters.title }}
        description: ${{ parameters.description }}
        entity: ${{ parameters.entity }}
        entityTitle: ${{ parameters.entity | capitalize }}
        entities: ${{ parameters.entities }}
        entitiesTitle: ${{ parameters.entities | capitalize }}
        owner: ${{ parameters.owner }}
        # its business service (System), in catalog-info.yaml and in the file of the application
        system: "${{ (parameters.system | parseEntityRef({ defaultKind: 'system', defaultNamespace: 'default' }) | pick('name')) if parameters.system else parameters.name }}"
        # false: the app-of-apps generates a minimal System for it (no specification yet)
        systemInSpecs: ${{ parameters.systemInSpecs }}
        environments: ${{ parameters.environments }}
        admins: ${{ parameters.admins }}
        buckets: ${{ parameters.s3Buckets }}
        sites: ${{ parameters.dmsSites }}
        siteGroups: ${{ parameters.dmsGroups }}
        datahub: ${{ parameters.datahub }}
        dataClassification: ${{ parameters.dataClassification }}
        dataReleasability: ${{ parameters.dataReleasability }}
        dataOwners: ${{ parameters.dataOwners }}
        dataOwnerGroups: ${{ parameters.dataOwnerGroups }}
        gateway: ${{ parameters.gateway }}
        gatewayTeam: ${{ parameters.gatewayTeam }}
        processes: ${{ parameters.processes }}
        processGroups: ${{ parameters.processGroups }}
        dashboards: ${{ parameters.dashboards }}
        flows: ${{ parameters.flows }}
        flowGroups: ${{ parameters.flowGroups }}
        monitoring: ${{ parameters.monitoring }}
        tag: ${{ steps['publish'].output.commitHash }}
        stage: ${{ parameters.initialStage }}
        spring: ${{ parameters.frameworkVersion + '.0' }}
        angular: 3.3.1
        postgres: 3.3.0
  - id: deploy
    name: Open the deployment pull request in refresquito-services
    action: publish:github:pull-request
    input:
      repoUrl: github.com?owner=javivillar&repo=refresquito-services
      branchName: deploy-${{ parameters.name }}
      targetBranchName: main
      sourcePath: ./deploy
      title: Deploy ${{ parameters.name }} (${{ parameters.title }}) in ${{ parameters.environments | join(", ") }}, stage ${{ parameters.initialStage
        }}
      commitMessage: '${{ parameters.name }}: a new application of the Spring Framework, deployed in ${{ parameters.environments | join(", ")
        }} (stage ${{ parameters.initialStage }})'
      description: '**${{ parameters.title }}**: ${{ parameters.description }}


        Created with the Backstage template "New application (Spring Framework)": repository

        [${{ parameters.owner }}/${{ parameters.name }}](https://github.com/${{ parameters.owner }}/${{ parameters.name }}), commit `${{ steps[''publish''].output.commitHash
        }}`.


        Merging this deploys it, with no pass of the bootstrap:


        | | |

        |---|---|

        | Environments | ${{ parameters.environments | join(", ") }} |

        | Stage | ${{ parameters.initialStage }} (it moves on with the template "Promote an application") |

        | Namespace | `<zone>-<program>-${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage)
        }}-oneke` |

        | URL | `https://${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage) }}.<domain>`
        |

        | Services | `${{ parameters.entities }}` (its API, its database, the primary one) and `notifier` (its events), each with its own PostgreSQL;
        events between them in RabbitMQ (block `events`) |


        | Images | `ghcr.io/${{ parameters.owner }}/${{ parameters.name }}-${{ parameters.entities }}`, `-notifier`, `-web` and `-platform`, tag
        of that commit (its CI must have finished) |

        | Platform blocks | `sso`: client `${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage)
        }}`, roles `${{ parameters.name }}-viewer` and `${{ parameters.name }}-admin`, their test users{% if parameters.s3Buckets | length %}.
        `s3`: buckets ${{ parameters.s3Buckets | join(", ") }} (each one as `${{ parameters.name }}-<bucket>`){% endif %}{% if parameters.dmsSites
        | length %}. `dms`: Alfresco sites ${{ parameters.dmsSites | join(", ") }} (each one as `${{ parameters.name }}-<site>`){% endif %}{%
        if parameters.datahub %}. `datahub`: data product with the tables of its database, ${{ parameters.dataClassification }}{% if parameters.initialStage
        != ''pro'' %} (only once it is in pro){% endif %}{% endif %}{% if parameters.gateway %}. `gateway`: its API at `/gateway/${{ parameters.name
        }}/` in Gravitee{% endif %}{% if parameters.processes %}. `processes`: its BPMN of `platform/processes/` in Camunda{% endif %}{% if parameters.dashboards
        %}. `dashboards`: its Superset export of `platform/dashboards/`{% endif %}{% if parameters.flows %}. `flows`: its Activepieces flows of
        `platform/flows/`{% endif %}{% if parameters.monitoring %}. `monitoring`: its metrics in Prometheus, dashboards Logs and Performance in
        Applications/<name>/<stage> of Grafana{% endif %} |

        | Spring Framework | ${{ parameters.frameworkVersion }} |


        Files: `bootstrap/app-of-apps/apps/${{ parameters.name }}.yaml` (what it is and what it uses) and

        `catalog/apis/${{ parameters.name }}-${{ parameters.entities }}.json` (the API of its service, for the catalog). See `charts/spring-app-oneke/INSTALL.md`.

        '
  output:
    links:
    - title: Repository
      url: ${{ steps['publish'].output.remoteUrl }}
    - title: Deployment pull request
      url: ${{ steps['deploy'].output.remoteUrl }}
    - title: Open in the catalog
      icon: catalog
      url: /console/entity/default/component/${{ parameters.name }}
    text:
    - title: Next - merge the deployment pull request
      content: 'The repository exists and its CI is building the images of commit `${{ steps[''publish''].output.commitHash }}`.


        Its deployment is proposed in a **pull request of refresquito-services** (the link above). Once the CI of the

        application has finished, merging that pull request deploys it: Argo CD creates

        `<zone>-<program>-${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage) }}-oneke`
        in ${{ parameters.environments | join(", ") }} (stage **${{ parameters.initialStage }}**), and

        within a few minutes the application answers on `https://${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name
        + ''-'' + parameters.initialStage) }}.<domain>` with its Keycloak client

        `${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage) }}`, its roles and
        the test users `${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage) }}-admin`
        and `${{ parameters.name if parameters.initialStage == ''pro'' else (parameters.name + ''-'' + parameters.initialStage) }}-viewer`.


        Nothing else is needed: no command to run and no pass of the bootstrap. To roll out a later commit, or to move it on

        to pre and pro, use the template **Promote an application**, the same for both frameworks.

        '
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: harbor-request-image
  title: Request a curated image
  description: >-
    Ask for a new container image (or a new tag of one) in the curated projects of Harbor (common, framework-python,
    framework-spring). It opens a pull request in opennebula with one file in harbor/catalog.d; the platform team
    reviews it, its CI checks it, and after the merge the next sync copies it into the quarantine, where it is
    scanned and promoted only if it passes the gate. Look first at the page Images: it may already be there.
  tags: [harbor, images, supply-chain]
  links:
    - title: How images get into Harbor
      url: https://github.com/javivillar/opennebula/blob/main/harbor/README.md#request-an-image
spec:
  owner: group:default/backstage-admin
  type: harbor-image
  parameters:
    - title: The image
      required: [source, tags, project]
      properties:
        source:
          title: Source
          description: >-
            Registry and repository, without tag. Docker Hardened Images first (dhi.io/<name>: they are signed, have
            SBOM, VEX and provenance); a community image only with a clean scan.
          type: string
          pattern: '^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+$'
          ui:placeholder: dhi.io/valkey
        tags:
          title: Tags
          description: One or more pinned tags (never latest). Check they exist, e.g. regctl manifest head dhi.io/valkey:8.1-debian13
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            pattern: '^(?!latest$)[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
        project:
          title: Project in Harbor
          type: string
          enum: [common, framework-python, framework-spring]
          enumNames:
            - "common: building blocks of the systems of the PaaS and of the platform"
            - "framework-python: base images of the Python framework"
            - "framework-spring: base images of the Spring framework"
          default: common
        name:
          title: Name in Harbor (optional)
          description: Default, the last part of the source (dhi.io/valkey -> valkey).
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]*$'
    - title: What it is for (shown on the page Images)
      required: [category, audience, summary, note]
      properties:
        category:
          title: Category
          type: string
          enum: [database, cache, messaging, web, runtime, build, observability, identity, security, data, search, storage, workflow, platform, tools]
          enumNames:
            - Databases
            - Caches and key-value stores
            - Messaging and events
            - Web servers and proxies
            - Runtimes of applications
            - Build stages
            - Metrics, logs, traces
            - Identity and access
            - Certificates, secrets, security
            - Data platform and analytics
            - Search engines
            - Object storage
            - Workflows and automation
            - Platform control plane
            - Tools and small bases
        audience:
          title: Who may use it
          type: string
          enum: [apps, platform]
          enumNames: ["apps: any system of the PaaS", "platform: only the platform services (e.g. licences the systems may not use)"]
          default: apps
        summary:
          title: Summary
          description: One line, what it is and when to use it.
          type: string
          maxLength: 200
        note:
          title: Why it is needed
          description: Who needs it and for what, and the scan you made (e.g. "Trivy 0 critical / 2 high, with its VEX 0/0").
          type: string
          ui:widget: textarea
        owner:
          title: Owner
          description: Group responsible for keeping it up to date.
          type: string
          default: platform-team
        license:
          title: Licence (SPDX, only if the image does not declare it)
          type: string
        eol:
          title: End of life (YYYY-MM-DD, only if the image does not declare it)
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  steps:
    - id: file
      name: Write the request (one file of harbor/catalog.d)
      action: fetch:template
      input:
        url: ./skeletons/harbor-image-request
        targetPath: ./request
        values:
          source: ${{ parameters.source }}
          tags: ${{ parameters.tags }}
          project: ${{ parameters.project }}
          nameGiven: ${{ parameters.name or '' }}   # the name typed, or empty (a value 'false' would be a non-empty string, i.e. true)
          name: ${{ parameters.name or parameters.source.split('/') | last }}
          fileName: ${{ parameters.project }}-${{ parameters.name or parameters.source.split('/') | last }}-${{ parameters.tags | join('-') }}
          category: ${{ parameters.category }}
          audience: ${{ parameters.audience }}
          summary: ${{ parameters.summary }}
          note: ${{ parameters.note }}
          owner: ${{ parameters.owner or 'platform-team' }}
          license: ${{ parameters.license }}
          eol: ${{ parameters.eol }}
          requestedBy: ${{ user.entity.metadata.name if user.entity else 'unknown' }}
    - id: pr
      name: Open the pull request in opennebula
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=opennebula
        branchName: request-image-${{ parameters.project }}-${{ parameters.name or parameters.source.split('/') | last }}-${{ parameters.tags | join('-') }}
        targetBranchName: main
        sourcePath: ./request
        targetPath: harbor/catalog.d
        title: "Request image ${{ parameters.project }}/${{ parameters.name or parameters.source.split('/') | last }}:${{ parameters.tags | join(', ') }}"
        commitMessage: "harbor catalog: request ${{ parameters.source }}:${{ parameters.tags | join(', ') }} into ${{ parameters.project }}"
        description: |
          **${{ parameters.source }}** — tags ${{ parameters.tags | join(', ') }} — into `${{ parameters.project }}`
          (${{ parameters.category }}, audience ${{ parameters.audience }}), requested in Backstage by ${{ user.entity.metadata.name if user.entity else 'unknown' }}.

          > ${{ parameters.summary }}

          Why: ${{ parameters.note }}

          ## Review (platform team)

          - [ ] Docker Hardened Image, or a community image with a clean scan (`harbor/compare-dhi.sh`, `harbor/vex-check.sh`)
          - [ ] The tags exist upstream (`regctl manifest head <source>:<tag>`) and are pinned
          - [ ] Licence allowed by the policy of Refresquito (open source; AGPL only with audience `platform`)
          - [ ] The CI of this pull request (harbor-catalog) is green: the catalog with this file is valid

          After the merge: `git pull` in the checkout of the Harbor host (the sync timer runs from it); the sync of 04:00
          (or `sudo ./harbor/install-harbor.sh sync`) copies it into `incoming`, scans it and promotes it only if it passes
          the gate. Then it is on the page Images of Backstage. If it is held, sync says why (`HELD`).
  output:
    links:
      - title: The pull request
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Images in Backstage
        url: /console/images
    text:
      - title: Next
        content: |
          The request is the pull request above, in **opennebula** (`harbor/catalog.d/${{ parameters.project }}-${{ parameters.name or parameters.source.split('/') | last }}-${{ parameters.tags | join('-') }}.toml`).
          The platform team reviews it; its CI checks the catalog. After the merge, the next sync of Harbor (daily at 04:00)
          copies the image into the quarantine and promotes it, signed, if it passes the scan and the VEX check.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: business-model-import
  title: Import business model
  description: >-
    Loads a business model (domains, subdomains and business processes) into the business map of a customer from a
    file: the APQC Process Classification Framework the customer downloaded, the Refresquito template, or the customer's
    own spreadsheet with a column mapping. It previews the changes first and proposes the result as a pull request
    to refresquito-services (catalog/business-map/<namespace>/); merging it is what loads it. The file itself is
    never stored in git. A reimport matches entities by their original ID, keeps what was edited in the portal and
    marks the ones no longer in the file as deprecated. Only for the groups business-architect and backstage-admin.
  tags: [business-map, continuity, apqc]
spec:
  owner: group:default/backstage-admin
  type: business-map
  parameters:
    - title: The file
      required: [source, file, namespace]
      properties:
        source:
          title: Source
          type: string
          enum: [apqc, template, own]
          enumNames:
            - "APQC PCF: the Excel downloaded from APQC (its layout is known)"
            - "Refresquito template: fixed columns ID, parent, title, owner, criticality, RPO, RTO, retention, applications"
            - "Own layout: the customer's spreadsheet as it is (map its columns on the next page)"
          default: template
        file:
          title: File
          description: Excel (.xlsx) or CSV. It is read by the import and never stored in git.
          type: string
          format: data-url
        sheet:
          title: Sheet
          description: The sheet of the Excel to read. Empty, the first one. Ignored for CSV.
          type: string
          default: ""
        namespace:
          title: Customer namespace
          description: >-
            The namespace of the customer in the catalog, e.g. occar-a400m. Its domains and processes are written to
            catalog/business-map/<namespace>/ of refresquito-services.
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        owner:
          title: Default owner
          description: Group that owns the processes the file gives no owner (empty, group:unassigned until assigned).
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        keepFrom:
          title: Keep the support categories of (optional)
          description: >-
            An APQC model already loaded: its support categories (finance, HR, IT...) are kept in this customer's
            model next to the ones of the file.
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: ReferenceModel
      dependencies:
        source:
          oneOf:
            - properties:
                source: { enum: [apqc] }
                industry:
                  title: Industry
                  description: The industry of the PCF file, e.g. aerospace-defense; empty for the cross-industry one.
                  type: string
                  pattern: '^([a-z0-9][a-z0-9-]*)?$'
                  default: ""
                version:
                  title: PCF version
                  type: string
                  pattern: '^[0-9]+(\.[0-9]+)*$'
                  default: "7.4"
              required: [version]
            - properties:
                source: { enum: [template, own] }
    - title: Mapping
      description: >-
        Only for an own layout: which column holds each field (a column letter, e.g. B, or its header) and what the
        values of the criticality column mean. APQC files and the Refresquito template are matched by themselves.
        The mapping is saved with the model and reused on the next import.
      dependencies:
        source:
          oneOf:
            - properties:
                source: { enum: [own] }
                mapping:
                  title: Columns
                  type: object
                  required: [id, title]
                  properties:
                    id: { title: ID, type: string }
                    title: { title: Title, type: string }
                    parent: { title: Parent ID (or give the level), type: string }
                    level: { title: Level (or give the parent), type: string }
                    owner: { title: Owner, type: string }
                    criticality: { title: Criticality, type: string }
                    rpo: { title: RPO, type: string }
                    rto: { title: RTO, type: string }
                    retention: { title: Retention, type: string }
                    applications: { title: Applications (business services, separated by commas), type: string }
                valueMapping:
                  title: Values
                  type: object
                  properties:
                    criticality:
                      title: Criticality values
                      description: Each value of the criticality column (e.g. Alta) and what it means.
                      type: object
                      additionalProperties:
                        type: string
                        enum: [critical, important, standard]
              required: [mapping]
            - properties:
                source: { enum: [apqc, template] }
    - title: Preview and confirm
      description: >-
        The template first previews the import without writing anything: counts (domains, subdomains, new, changed,
        no longer in the file, unchanged), the errors that stop it (a parent not in the file, a duplicated ID, a
        missing required column), the warnings (an application not in the catalog, an owner that is no group) and the
        list of changes. Run it once with "Only preview" to read them; run it again without it to open the pull
        request. With errors, nothing is imported unless you skip the rows with errors.
      properties:
        previewOnly:
          title: Only preview
          description: Show the preview and stop; nothing is written.
          type: boolean
          default: true
        skipErrors:
          title: Skip the rows with errors
          description: Import the rest of the file and leave out the rows with errors (listed in the pull request).
          type: boolean
          default: false
  steps:
    # who may change the business map: business-architect and backstage-admin (checked here until the permission
    # framework covers templates); the step only runs, and fails, for anybody else
    - id: allowed
      name: "Check the groups: only business-architect and backstage-admin may change the business map"
      if: ${{ not (('"group:default/business-architect"' in ((user.entity.relations if user.entity else []) | dump)) or ('"group:default/backstage-admin"' in ((user.entity.relations if user.entity else []) | dump))) }}
      action: catalog:fetch
      input:
        entityRef: group:default/only-business-architect-or-backstage-admin-may-change-the-business-map
    - id: preview
      name: Preview the import (nothing is written)
      action: refresquito:business-model:preview
      input:
        source: ${{ parameters.source }}
        file: ${{ parameters.file }}
        # rjsf puts the name of the file in the data URL (data:<type>;name=<file>;base64,...)
        fileName: ${{ parameters.file.split(';name=')[1].split(';')[0] if ';name=' in parameters.file else 'upload' }}
        sheet: ${{ parameters.sheet }}
        namespace: ${{ parameters.namespace }}
        owner: ${{ parameters.owner }}
        mapping: ${{ parameters.mapping }}
        valueMapping: ${{ parameters.valueMapping }}
        keepFrom: ${{ parameters.keepFrom }}
        industry: ${{ parameters.industry }}
        version: ${{ parameters.version }}
    # stops here with "Only preview", or when the preview has errors and they are not skipped
    - id: import
      name: Write the entities (catalog/business-map/${{ parameters.namespace }}/)
      if: ${{ (not parameters.previewOnly) and (parameters.skipErrors or (steps.preview.output.errors | length) == 0) }}
      action: refresquito:business-model:import
      input:
        source: ${{ parameters.source }}
        file: ${{ parameters.file }}
        fileName: ${{ parameters.file.split(';name=')[1].split(';')[0] if ';name=' in parameters.file else 'upload' }}
        sheet: ${{ parameters.sheet }}
        namespace: ${{ parameters.namespace }}
        owner: ${{ parameters.owner }}
        mapping: ${{ parameters.mapping }}
        valueMapping: ${{ parameters.valueMapping }}
        keepFrom: ${{ parameters.keepFrom }}
        industry: ${{ parameters.industry }}
        version: ${{ parameters.version }}
        skipErrors: ${{ parameters.skipErrors }}
    - id: pr
      name: Open the pull request in refresquito-services
      if: ${{ (not parameters.previewOnly) and (parameters.skipErrors or (steps.preview.output.errors | length) == 0) }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: business-map-import-${{ parameters.namespace }}
        targetBranchName: main
        sourcePath: ./catalog/business-map/${{ parameters.namespace }}
        targetPath: catalog/business-map/${{ parameters.namespace }}
        title: "Business map: import the business model of ${{ parameters.namespace }} (${{ parameters.source }})"
        commitMessage: "business map ${{ parameters.namespace }}: import ${{ parameters.source }} model"
        description: |
          Business model of **${{ parameters.namespace }}** imported in Backstage by ${{ user.entity.metadata.name if user.entity else 'unknown' }}
          from a file of source `${{ parameters.source }}` (the file is not in git; only the entities made from it).

          | Domains | Subdomains | New | Changed | No longer in the file | Unchanged |
          |---|---|---|---|---|---|
          | ${{ steps.preview.output.counts.domains }} | ${{ steps.preview.output.counts.subdomains }} | ${{ steps.preview.output.counts.new }} | ${{ steps.preview.output.counts.changed }} | ${{ steps.preview.output.counts.gone }} | ${{ steps.preview.output.counts.unchanged }} |

          {% if steps.preview.output.errors | length %}**Rows with errors, left out:**
          {% for e in steps.preview.output.errors %}
          - row ${{ e.row }}: ${{ e.message }}{% endfor %}
          {% endif %}{% if steps.preview.output.warnings | length %}**Warnings:**
          {% for w in steps.preview.output.warnings %}
          - ${{ w.message if w.message else w }}{% endfor %}
          {% endif %}
          **Changes:**
          {% for c in steps.preview.output.changes %}
          - ${{ c.kind }} `${{ c.id }}` ${{ c.title }}: ${{ c.what }}{% endfor %}

          Reimport rules: entities are matched by their original ID; fields edited in the portal after the last import
          (owner, applications, overrides) keep the portal value; entities no longer in the file are kept and marked
          deprecated for review, never deleted. Files: `catalog/business-map/${{ parameters.namespace }}/`.
  output:
    links:
      - title: The pull request
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Business map
        url: /console/business-map
    text:
      - title: Preview
        content: |
          | Domains | Subdomains | New | Changed | No longer in the file | Unchanged |
          |---|---|---|---|---|---|
          | ${{ steps.preview.output.counts.domains }} | ${{ steps.preview.output.counts.subdomains }} | ${{ steps.preview.output.counts.new }} | ${{ steps.preview.output.counts.changed }} | ${{ steps.preview.output.counts.gone }} | ${{ steps.preview.output.counts.unchanged }} |

          **Errors** (${{ steps.preview.output.errors | length }}){% if (steps.preview.output.errors | length) and not parameters.skipErrors %}: nothing was imported; fix them, or run it again with "Skip the rows with errors"{% endif %}
          {% for e in steps.preview.output.errors %}
          - row ${{ e.row }}: ${{ e.message }}{% endfor %}

          **Warnings** (${{ steps.preview.output.warnings | length }})
          {% for w in steps.preview.output.warnings %}
          - ${{ w.message if w.message else w }}{% endfor %}

          **Changes** (${{ steps.preview.output.changes | length }})
          {% for c in steps.preview.output.changes %}
          - ${{ c.kind }} `${{ c.id }}` ${{ c.title }}: ${{ c.what }}{% endfor %}

          {% if parameters.previewOnly %}Only a preview: nothing was written. Run the template again without "Only preview" to open the pull request.{% endif %}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: business-model-adopt
  title: Adopt reference model
  description: >-
    Copies the level-1 domains of a reference model (e.g. the APQC PCF for aerospace & defense) that apply to a
    customer, with their subdomains and business processes, into the customer's namespace, keeping their APQC IDs.
    It proposes them as a pull request to refresquito-services (catalog/business-map/<namespace>/); adapt them
    afterwards with "Edit business process". Only for the groups business-architect and backstage-admin.
  tags: [business-map, continuity, apqc]
spec:
  owner: group:default/backstage-admin
  type: business-map
  parameters:
    - title: The model
      required: [model, categories, namespace, owner]
      properties:
        model:
          title: Reference model
          description: A model already loaded with "Import business model" (source apqc or template).
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: ReferenceModel
        categories:
          title: Categories that apply
          description: >-
            The IDs of its level-1 domains to copy, e.g. 1.0, 2.0, 6.0 (see the model in the catalog). Add the support
            categories of the cross-industry model too if it is loaded (finance, HR, IT...).
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        namespace:
          title: Customer namespace
          description: Where the copy goes, e.g. occar-a400m (catalog/business-map/<namespace>/ of refresquito-services).
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        owner:
          title: Owner group
          description: Owns the copied domains and processes until each one gets its own owner.
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
  steps:
    - id: allowed
      name: "Check the groups: only business-architect and backstage-admin may change the business map"
      if: ${{ not (('"group:default/business-architect"' in ((user.entity.relations if user.entity else []) | dump)) or ('"group:default/backstage-admin"' in ((user.entity.relations if user.entity else []) | dump))) }}
      action: catalog:fetch
      input:
        entityRef: group:default/only-business-architect-or-backstage-admin-may-change-the-business-map
    - id: adopt
      name: Copy the domains and processes (catalog/business-map/${{ parameters.namespace }}/)
      action: refresquito:business-model:adopt
      input:
        model: ${{ parameters.model }}
        categories: ${{ parameters.categories }}
        namespace: ${{ parameters.namespace }}
        owner: ${{ parameters.owner }}
    - id: pr
      name: Open the pull request in refresquito-services
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: business-map-adopt-${{ parameters.namespace }}-${{ parameters.model | parseEntityRef | pick('name') }}
        targetBranchName: main
        sourcePath: ./catalog/business-map/${{ parameters.namespace }}
        targetPath: catalog/business-map/${{ parameters.namespace }}
        title: "Business map: ${{ parameters.namespace }} adopts ${{ parameters.model | parseEntityRef | pick('name') }}"
        commitMessage: "business map ${{ parameters.namespace }}: adopt ${{ parameters.model | parseEntityRef | pick('name') }} (${{ parameters.categories | join(', ') }})"
        description: |
          **${{ parameters.namespace }}** adopts the categories ${{ parameters.categories | join(', ') }} of the reference model
          `${{ parameters.model }}`, owned by `${{ parameters.owner }}`; requested in Backstage by ${{ user.entity.metadata.name if user.entity else 'unknown' }}.

          The domains, subdomains and processes keep their `apqc.org/pcf-id`. Files: `catalog/business-map/${{ parameters.namespace }}/`.
  output:
    links:
      - title: The pull request
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Business map
        url: /console/business-map
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: business-process-new
  title: New business process
  description: >-
    Adds a business process to the business map of a customer: its domain, its owner, its continuity criticality
    (critical, important, standard: the RPO, RTO and retention it needs, unless overridden here) and the business
    services it depends on. It proposes it as a pull request to refresquito-services
    (catalog/business-map/<namespace>/process-<name>.yaml). Only for the groups business-architect and backstage-admin.
  tags: [business-map, continuity]
spec:
  owner: group:default/backstage-admin
  type: business-map
  parameters:
    - title: The process
      required: [title, name, domain, owner, criticality]
      properties:
        title:
          title: Title
          description: How people read it, e.g. Manage repair and maintenance.
          type: string
          maxLength: 120
          pattern: '^[^"]+$'
          ui:autofocus: true
        name:
          title: Name
          description: The slug of the title, unique in the namespace, e.g. manage-repair-and-maintenance.
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        description:
          title: Description
          type: string
          maxLength: 300
          default: ""
        domain:
          title: Domain
          description: The business area it belongs to; the process goes in the namespace of that domain (the customer).
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Domain
              spec.type: business-area
        owner:
          title: Owner group
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        processKey:
          title: Process key (optional)
          description: The key of its BPMN in the process engine, e.g. maintenance-event.
          type: string
          pattern: '^([A-Za-z_][A-Za-z0-9_.-]*)?$'
          default: ""
    - title: Continuity
      description: >-
        The criticality sets the RPO and RTO it needs (critical 15m / 4h, important 4h / 24h, standard 24h / 72h by
        default); an override here replaces that value. The requirement is inherited by the business services it
        depends on and checked against what their production instances deliver. It is not the support tier
        (gold / silver / bronze) of the components.
      required: [criticality]
      properties:
        criticality:
          title: Criticality
          type: string
          enum: [critical, important, standard]
          default: standard
        rpo:
          title: RPO override
          description: Empty, the default of its criticality. A number and m, h, d or y, e.g. 15m.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        rto:
          title: RTO override
          description: Empty, the default of its criticality, e.g. 4h.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        retention:
          title: Retention
          description: How long its records are kept, e.g. 30y. Empty, not declared.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        dependsOn:
          title: Business services it depends on
          type: array
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: System
              spec.type: business-service
          default: []
  steps:
    - id: allowed
      name: "Check the groups: only business-architect and backstage-admin may change the business map"
      if: ${{ not (('"group:default/business-architect"' in ((user.entity.relations if user.entity else []) | dump)) or ('"group:default/backstage-admin"' in ((user.entity.relations if user.entity else []) | dump))) }}
      action: catalog:fetch
      input:
        entityRef: group:default/only-business-architect-or-backstage-admin-may-change-the-business-map
    - id: file
      name: Write the process
      action: fetch:template
      input:
        url: ./skeletons/business-process
        targetPath: ./out/catalog/business-map/${{ parameters.domain | parseEntityRef | pick('namespace') }}
        values:
          template: New business process
          # one file per process: process-<name>.yaml (Edit business process rewrites it)
          fileName: process-${{ parameters.name }}
          name: ${{ parameters.name }}
          namespace: ${{ parameters.domain | parseEntityRef | pick('namespace') }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          domain: ${{ parameters.domain }}
          owner: ${{ parameters.owner }}
          criticality: ${{ parameters.criticality }}
          rpo: ${{ parameters.rpo }}
          rto: ${{ parameters.rto }}
          retention: ${{ parameters.retention }}
          dependsOn: ${{ parameters.dependsOn }}
          processKey: ${{ parameters.processKey }}
    - id: pr
      name: Open the pull request in refresquito-services
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: business-process-${{ parameters.domain | parseEntityRef | pick('namespace') }}-${{ parameters.name }}
        targetBranchName: main
        sourcePath: ./out
        title: "Business map: new process ${{ parameters.title }} (${{ parameters.domain | parseEntityRef | pick('namespace') }})"
        commitMessage: "business map ${{ parameters.domain | parseEntityRef | pick('namespace') }}: new process ${{ parameters.name }}"
        description: |
          New business process **${{ parameters.title }}** in `${{ parameters.domain }}`, owned by `${{ parameters.owner }}`,
          criticality **${{ parameters.criticality }}**{% if parameters.rpo %}, RPO ${{ parameters.rpo }}{% endif %}{% if parameters.rto %}, RTO ${{ parameters.rto }}{% endif %}{% if parameters.retention %}, retention ${{ parameters.retention }}{% endif %};
          depends on ${{ parameters.dependsOn | join(', ') if parameters.dependsOn | length else 'nothing yet' }}.
          Requested in Backstage by ${{ user.entity.metadata.name if user.entity else 'unknown' }}.

          File: `catalog/business-map/${{ parameters.domain | parseEntityRef | pick('namespace') }}/process-${{ parameters.name }}.yaml`.
  output:
    links:
      - title: The pull request
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Business map
        url: /console/business-map
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: business-process-edit
  title: Edit business process
  description: >-
    Changes a business process of the business map: owner, criticality, RPO/RTO/retention overrides, the business
    services it depends on, its process key. The console opens it prefilled (formData in the URL). It proposes the
    change as a pull request to refresquito-services. Only processes kept in a file of their own
    (catalog/business-map/<namespace>/process-<name>.yaml); an imported or adopted one is edited by its next import.
    Only for the groups business-architect and backstage-admin.
  tags: [business-map, continuity]
spec:
  owner: group:default/backstage-admin
  type: business-map
  parameters:
    - title: The process
      required: [process, title, domain, owner]
      properties:
        process:
          title: Process
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: BusinessProcess
        title:
          title: Title
          type: string
          maxLength: 120
          pattern: '^[^"]+$'
        description:
          title: Description
          type: string
          maxLength: 300
          default: ""
        domain:
          title: Domain
          description: The business area it belongs to (of the same customer).
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Domain
              spec.type: business-area
        owner:
          title: Owner group
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Group
        processKey:
          title: Process key (optional)
          description: The key of its BPMN in the process engine, e.g. maintenance-event.
          type: string
          pattern: '^([A-Za-z_][A-Za-z0-9_.-]*)?$'
          default: ""
    - title: Continuity
      description: >-
        The criticality sets the RPO and RTO it needs (critical 15m / 4h, important 4h / 24h, standard 24h / 72h by
        default); an override here replaces that value. It is not the support tier (gold / silver / bronze) of the
        components.
      required: [criticality]
      properties:
        criticality:
          title: Criticality
          type: string
          enum: [critical, important, standard]
          default: standard
        rpo:
          title: RPO override
          description: Empty, the default of its criticality. A number and m, h, d or y, e.g. 15m.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        rto:
          title: RTO override
          description: Empty, the default of its criticality, e.g. 4h.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        retention:
          title: Retention
          description: How long its records are kept, e.g. 30y. Empty, not declared.
          type: string
          pattern: '^([0-9]+(m|h|d|y))?$'
          default: ""
        dependsOn:
          title: Business services it depends on
          type: array
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: System
              spec.type: business-service
          default: []
  steps:
    - id: allowed
      name: "Check the groups: only business-architect and backstage-admin may change the business map"
      if: ${{ not (('"group:default/business-architect"' in ((user.entity.relations if user.entity else []) | dump)) or ('"group:default/backstage-admin"' in ((user.entity.relations if user.entity else []) | dump))) }}
      action: catalog:fetch
      input:
        entityRef: group:default/only-business-architect-or-backstage-admin-may-change-the-business-map
    - id: current
      name: Read the process from the catalog
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.process }}
    # only a process kept in its own file can be rewritten whole; one written by an import or an adoption shares
    # the file of its domain with the others (the step only runs, and fails, then)
    - id: ownfile
      name: "Check the file: only a process of its own file (process-<name>.yaml) is edited here"
      if: ${{ not (('/catalog/business-map/' + (parameters.process | parseEntityRef | pick('namespace')) + '/process-' + (parameters.process | parseEntityRef | pick('name')) + '.yaml') in (steps.current.output.entity.metadata.annotations['backstage.io/managed-by-location'] or '')) }}
      action: catalog:fetch
      input:
        entityRef: group:default/imported-processes-are-edited-by-their-next-import
    - id: file
      name: Write the process
      action: fetch:template
      input:
        url: ./skeletons/business-process
        targetPath: ./out/catalog/business-map/${{ parameters.process | parseEntityRef | pick('namespace') }}
        values:
          template: Edit business process
          fileName: process-${{ parameters.process | parseEntityRef | pick('name') }}
          name: ${{ parameters.process | parseEntityRef | pick('name') }}
          namespace: ${{ parameters.process | parseEntityRef | pick('namespace') }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          domain: ${{ parameters.domain }}
          owner: ${{ parameters.owner }}
          criticality: ${{ parameters.criticality }}
          rpo: ${{ parameters.rpo }}
          rto: ${{ parameters.rto }}
          retention: ${{ parameters.retention }}
          dependsOn: ${{ parameters.dependsOn }}
          processKey: ${{ parameters.processKey }}
          # every annotation of the current process (imported-hash, APQC IDs, deprecated...): the skeleton keeps them
          # all except the ones the catalog adds, and takes the process key from the form
          annotations: ${{ steps.current.output.entity.metadata.annotations }}
    - id: pr
      name: Open the pull request in refresquito-services
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=javivillar&repo=refresquito-services
        branchName: business-process-edit-${{ parameters.process | parseEntityRef | pick('namespace') }}-${{ parameters.process | parseEntityRef | pick('name') }}
        targetBranchName: main
        sourcePath: ./out
        title: "Business map: edit process ${{ parameters.title }} (${{ parameters.process | parseEntityRef | pick('namespace') }})"
        commitMessage: "business map ${{ parameters.process | parseEntityRef | pick('namespace') }}: edit process ${{ parameters.process | parseEntityRef | pick('name') }}"
        description: |
          Business process **${{ parameters.title }}** (`${{ parameters.process }}`) changed in Backstage by
          ${{ user.entity.metadata.name if user.entity else 'unknown' }}: owner `${{ parameters.owner }}`, domain `${{ parameters.domain }}`,
          criticality **${{ parameters.criticality }}**{% if parameters.rpo %}, RPO ${{ parameters.rpo }}{% endif %}{% if parameters.rto %}, RTO ${{ parameters.rto }}{% endif %}{% if parameters.retention %}, retention ${{ parameters.retention }}{% endif %};
          depends on ${{ parameters.dependsOn | join(', ') if parameters.dependsOn | length else 'nothing' }}.

          File: `catalog/business-map/${{ parameters.process | parseEntityRef | pick('namespace') }}/process-${{ parameters.process | parseEntityRef | pick('name') }}.yaml`.
  output:
    links:
      - title: The pull request
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Business map
        url: /console/business-map
