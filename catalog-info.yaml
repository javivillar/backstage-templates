          title: Client ID
          description: Identifies the client to update.
          type: string
        name:
          title: Display name
          type: string
        description:
          title: Description
          type: string
        redirectUris:
          title: Redirect URIs
          type: array
          items:
            type: string
        webOrigins:
          title: Web origins (CORS)
          type: array
          items:
            type: string
        serviceAccountsEnabled:
          title: Enable service account (client credentials grant)
          type: boolean
  steps:
    - id: update-client
      name: Update client in Keycloak
      action: keycloak:update-client
      input:
        clientId: ${{ parameters.clientId }}
        name: ${{ parameters.name }}
        description: ${{ parameters.description }}
        redirectUris: ${{ parameters.redirectUris }}
        webOrigins: ${{ parameters.webOrigins }}
        serviceAccountsEnabled: ${{ parameters.serviceAccountsEnabled }}
  output:
    text:
      - title: Resultado
