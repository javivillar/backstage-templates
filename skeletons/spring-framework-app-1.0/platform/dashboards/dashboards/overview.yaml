description: null
css: null
slug: ${{ values.name }}
certified_by: null
certification_details: null
published: true
uuid: d8f886f6-79e7-4934-8ca3-5552100f347f
position:
  DASHBOARD_VERSION_KEY: v2
  ROOT_ID:
    type: ROOT
    id: ROOT_ID
    children:
    - GRID_ID
  GRID_ID:
    type: GRID
    id: GRID_ID
    children:
    - ROW-1
    parents:
    - ROOT_ID
  ROW-1:
    type: ROW
    id: ROW-1
