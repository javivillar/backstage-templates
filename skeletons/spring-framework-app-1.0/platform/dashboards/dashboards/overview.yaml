  CHART-${{ values.entities }}-by-status:
    type: CHART
    id: CHART-${{ values.entities }}-by-status
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-1
    meta:
      chartId: 1
      height: 50
      sliceName: ${{ values.entitiesTitle }} by status
      uuid: a8b62086-5b71-4643-a544-c8e762a832c6
