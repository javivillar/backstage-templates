# Backend tests against a real PostgreSQL, frontend tests, the contract between the two
# (backend/openapi.json must be what the API publishes; the web generates its types from it),
# and the two images pushed to ghcr.io with the commit as tag once the tests of main pass.
# Nothing here names the application: the same file serves every application of the framework.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 20
    env:
      RQ_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:55432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --find-links ../vendor -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: openapi.json is what the API publishes
        run: |
          module=$(basename "$(dirname src/*/openapi.py)")
          python -m "$module.openapi" > /tmp/openapi.json
          python - <<'PY'
          import json, sys
          if json.load(open("openapi.json")) != json.load(open("/tmp/openapi.json")):
              sys.exit("::error::backend/openapi.json is out of date: run 'python -m <module>.openapi > openapi.json' in backend/ and commit it")
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  images:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-web:${{ github.sha }}
