[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "${{ values.name }}"
version = "0.1.0"
description = "${{ values.title }} API: the example service of the Refresquito frameworks"
requires-python = ">=3.12"
dependencies = [
    # installed from ../vendor (pip --find-links) while its repository is private: see the README
    "refresquito-fastapi[db${{ ',s3' if values.buckets | length else '' }}]~=3.1.2",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",   # file uploads (documents, files)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "anyio>=4", "ruff>=0.7", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/${{ values.name }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=${{ values.name }} --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]   # SQLAlchemy async runs the driver in greenlets

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the names given when the application was created can make a line too long
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

# Types (CI: the quality report; it only reports for now). refresquito-fastapi ships its types (py.typed) since 3.1.1.
[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
