# ${{ values.title }} frontend: static files, with the configuration of this cluster written at start-up.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # written by 40-config-json.sh from the environment: never cached
    location = /config.json {
        alias /tmp/config.json;
        add_header Cache-Control "no-store";
    }
    # file names carry a hash: cache them for good
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # every route of the application is index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
